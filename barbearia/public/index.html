<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14110f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Gestão da Barbearia</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icone.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icone-180.png" />
  <meta name="apple-mobile-web-app-title" content="Barbearia" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Entrada -->
  <section id="tela-entrada" class="entrada" hidden>
    <div class="cartao entrada-cartao">
      <img src="/icone.svg" alt="" width="56" height="56" />
      <h1 id="entrada-titulo">Gestão da Barbearia</h1>
      <p id="entrada-texto" class="sutil"></p>
      <div id="entrada-quem"></div>
      <form id="form-entrada">
        <label id="campo-nome" hidden>Nome da barbearia<input name="nome" autocomplete="organization" /></label>
        <label id="rotulo-senha">Senha<input name="senha" type="password" autocomplete="current-password" required minlength="4" /></label>
        <button class="btn primario largo" type="submit" id="btn-entrada">Entrar</button>
        <p class="erro" id="erro-entrada"></p>
      </form>
    </div>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="topo">
      <div class="marca"><img src="/icone.svg" alt="" width="28" height="28" /><span id="nome-barbearia"></span></div>
      <div class="linha"><span class="sutil" id="quem-sou"></span><button class="btn fantasma pequeno" id="btn-sair">Sair</button></div>
    </header>
    <nav class="abas" id="abas">
      <button data-aba="caixa" class="ativa">Caixa</button>
      <button data-aba="meus" hidden>Meus números</button>
      <button data-aba="painel">Painel</button>
      <button data-aba="comissoes">Comissões</button>
      <button data-aba="clientes">Clientes</button>
      <button data-aba="fiados">Fiado</button>
      <button data-aba="contas">Contas</button>
      <button data-aba="planos">Planos</button>
      <button data-aba="lancamentos">Lançamentos</button>
      <button data-aba="cadastros">Cadastros</button>
      <button data-aba="ajustes">Dados e ajustes</button>
    </nav>
    <main id="conteudo"></main>
  </div>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  <dialog id="dialogo"><form method="dialog" id="dialogo-form"></form></dialog>

  <script src="/app.js" type="module"></script>
  <script>
    if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  </script>
</body>
</html>
