<title>Liga das Bolinhas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: app de celular em uma coluna — cabeçalho fixo, conteúdo rolável, abas embaixo; partida em tela cheia */
:root {
  --night: #0c1d22;
  --panel: #14303a;
  --panel-2: #1b3d48;
  --line: #2a525e;
  --chalk: #eef5f0;
  --muted: #94b4ad;
  --amber: #ffb547;
  --amber-ink: #2b1a00;
  --good: #4fd18b;
  --bad: #ff6b6b;
  --grass-1: #2f7f42;
  --grass-2: #2a733b;
  --f-display: "Bungee", "Arial Black", Impact, sans-serif;
  --f-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--chalk); font-family: var(--f-body); font-size: 15px;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--f-display); font-size: 15px; white-space: nowrap; letter-spacing: .02em; line-height: 1; }
.brand small { display: block; font-family: var(--f-body); font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.coins { white-space: nowrap; display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe19c, var(--amber) 60%, #c27a12); }
main { flex: 1; overflow-y: auto; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--night); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { background: none; border: 0; padding: 12px 4px 10px; font-size: 12px; font-weight: 500; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav.tabs button .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; }
nav.tabs button[aria-current="true"] { color: var(--amber); }
nav.tabs button[aria-current="true"] .dot { background: currentColor; }

h2 { font-family: var(--f-display); font-size: 16px; font-weight: 400; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.btn { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 700; font-size: 15px; background: var(--panel-2); border: 1px solid var(--line); }
.btn.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
.btn.small { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .4; cursor: default; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.badge { width: 28px; height: 28px; border-radius: 50%; flex: none; border: 4px solid; }
.badge.lg { width: 54px; height: 54px; border-width: 8px; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.vs .side { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.vs .name { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.vs .mid { font-family: var(--f-display); font-size: 20px; color: var(--muted); }
.ovr { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { background: none; border: 0; border-radius: 8px; padding: 8px 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--chalk); box-shadow: inset 0 0 0 1px var(--amber); }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
th { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; text-align: right; padding: 6px 4px; }
td { padding: 8px 4px; text-align: right; border-top: 1px solid var(--line); }
th:nth-child(2), td:nth-child(2) { text-align: left; }
td.pos { width: 26px; text-align: center; font-weight: 700; box-shadow: inset 3px 0 0 transparent; }
tr.up td.pos { box-shadow: inset 3px 0 0 var(--good); }
tr.down td.pos { box-shadow: inset 3px 0 0 var(--bad); }
tr.me td { background: rgba(255,181,71,.1); }
td .tn { display: flex; align-items: center; gap: 8px; min-width: 0; }
td .tn .badge { width: 16px; height: 16px; border-width: 3px; }
td.pts { font-weight: 700; color: var(--chalk); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.player { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; padding-top: 12px; border-top: 1px solid var(--line); }
.player:first-of-type { border-top: 0; padding-top: 0; }
.pnum { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; border: 3px solid; }
.pname { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pname input { background: transparent; border: 0; border-bottom: 1px dashed var(--line); padding: 2px 0; font-weight: 700; min-width: 0; width: 100%; }
.stats { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.stat { display: grid; grid-template-columns: 34px 1fr 28px auto; gap: 8px; align-items: center; font-size: 12px; }
.stat .k { color: var(--muted); font-weight: 500; letter-spacing: .06em; }
.bar { height: 6px; background: var(--night); border-radius: 3px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--amber); border-radius: 3px; }
.stat .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.plus { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 700; display: flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
.plus .coin { width: 10px; height: 10px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field input[type=text] { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.tn-btn { background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left; }
.tn-btn span:last-child { text-decoration: underline dotted var(--line); text-underline-offset: 3px; }
.clubs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.club-btn { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; text-align: left; font-size: 13px; font-weight: 500; min-width: 0; }
.club-btn .badge { width: 20px; height: 20px; border-width: 3px; }
.club-btn span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.club-btn[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.start-bar { position: sticky; bottom: 0; background: var(--panel); padding-top: 8px; }
.edit-row { display: grid; grid-template-columns: 1fr 90px; gap: 10px; }
.sw { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 2px solid var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--night), 0 0 0 5px var(--amber); }
.forms { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.form-btn { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
.form-btn[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.form-btn canvas { width: 100%; max-width: 70px; aspect-ratio: 3/4; }

.results { display: flex; flex-direction: column; }
.res { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.res:first-child { border-top: 0; }
.res .h { display: flex; justify-content: flex-end; align-items: center; gap: 6px; text-align: right; }
.res .a { display: flex; align-items: center; gap: 6px; }
.res .badge { width: 14px; height: 14px; border-width: 3px; }
.res .sc { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; background: var(--night); border-radius: 6px; padding: 3px 6px; }
.res.me { color: var(--amber); }
.round-h { display: flex; justify-content: space-between; align-items: baseline; }
.pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); }
.pill.w { background: var(--good); color: #062414; } .pill.d { background: var(--muted); color: #0c1d22; } .pill.l { background: var(--bad); color: #2a0606; }
.scorers li { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.scorers li:first-child { border-top: 0; }
.scorers ol { list-style: none; margin: 0; padding: 0; }

/* Partida */
.match { position: fixed; inset: 0; background: var(--night); display: flex; flex-direction: column; align-items: center; z-index: 20;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.board { width: 100%; max-width: 520px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 0 6px; }
.board .t { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 16px; min-width: 0; }
.board .t.r { justify-content: flex-end; }
.board .badge { width: 22px; height: 22px; border-width: 4px; }
.board .score { font-family: var(--f-display); font-size: 30px; font-variant-numeric: tabular-nums; text-align: center; line-height: 1; }
.board .clock { display: block; font-family: var(--f-body); font-size: 12px; color: var(--amber); font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.feed { width: 100%; max-width: 520px; min-height: 18px; font-size: 12px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pitch-wrap { flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; position: relative; }
#pitch { display: block; border-radius: 12px; touch-action: manipulation; }
.controls { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 8px; padding: 8px 0 12px; }
.controls .row > * { flex: 1; }
.endpanel { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(12,29,34,.82); padding: 16px; }
.endpanel .card { width: 100%; max-width: 380px; text-align: center; }
.final { font-family: var(--f-display); font-size: 40px; }
.goals-list { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.reward { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--amber); justify-content: center; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; }
nav.tabs { grid-template-columns: repeat(5, 1fr); }
.top-r { display: flex; align-items: center; gap: 8px; }
.help { width: 34px; height: 34px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); font-weight: 700; }
.money { font-variant-numeric: tabular-nums; }
.money.neg { color: var(--bad); }
.list { display: flex; flex-direction: column; }
.prow { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.list > :first-child { border-top: 0; }
.prow .pnum { width: 30px; height: 30px; font-size: 12px; border-width: 2px; }
.prow .nm { font-weight: 700; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .meta { font-size: 12px; color: var(--muted); }
.prow .ov { font-family: var(--f-display); font-size: 16px; font-variant-numeric: tabular-nums; }
.expand { padding: 4px 0 14px 40px; display: flex; flex-direction: column; gap: 10px; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; letter-spacing: .04em; text-transform: uppercase; background: var(--panel-2); color: var(--muted); vertical-align: 1px; }
.tag.inj { background: var(--bad); color: #2a0606; }
.tag.new { background: var(--good); color: #062414; }
.tag.gold { background: var(--amber); color: var(--amber-ink); }
.selrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; max-width: 100%; }
.news { display: flex; flex-direction: column; }
.news-item { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.news-item:first-child { border-top: 0; }
.news-item p { margin: 0; line-height: 1.4; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
.kv:first-child { border-top: 0; }
.kv b.pos { color: var(--good); } .kv b.neg { color: var(--bad); }
.progress { height: 8px; background: var(--night); border-radius: 4px; overflow: hidden; }
.progress b { display: block; height: 100%; background: var(--amber); }
.offer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.offer:first-child { border-top: 0; }
.big { font-family: var(--f-display); font-size: 26px; line-height: 1; }
.alert { border-color: var(--amber); }
.grp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grp table { font-size: 12px; }
@media (max-width: 420px) { .grp { grid-template-columns: 1fr; } }
/* tutorial */
.tut { position: fixed; inset: 0; z-index: 50; }
.tut .spot { position: fixed; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(4,12,14,.78); outline: 2px solid var(--amber); transition: all .25s ease; pointer-events: none; }
.tut .bubble { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); max-width: 440px; margin: 0 auto; background: var(--panel); border: 1px solid var(--amber); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.tut .bubble h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.tut .bubble p { margin: 0; line-height: 1.45; }
.tut .steps { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">Liga das Bolinhas<small id="sub">Temporada 1</small></div>
    <div class="top-r">
      <div class="coins money" id="money" title="Verba do clube"><span class="coin"></span><span id="coins">R$ 0</span></div>
      <button class="help" id="help" aria-label="Como jogar">?</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="home"><span class="dot"></span>Início</button>
    <button data-tab="comp"><span class="dot"></span>Torneios</button>

  <div class="board">
    <div class="t"><span class="badge" id="bU"></span><span id="nU">BOL</span></div>
    <div class="score"><span id="sc">0 - 0</span><span class="clock" id="clk">0'</span></div>

  </div>

<script>
(() => {
/* ================= MOTOR DA PARTIDA ================= */
const W = 340, H = 540, GW = 88, PR = 9, BR = 5, FRAMES = 3600, DT = 1 / 60, SC = 1.12;
const D4 = [[.14,.80],[.38,.84],[.62,.84],[.86,.80]];
const FORM = {
  '4-4-2':   [...D4, [.14,.62],[.38,.66],[.62,.66],[.86,.62], [.38,.53],[.62,.53]],
  '4-3-3':   [...D4, [.28,.67],[.50,.70],[.72,.67], [.16,.54],[.50,.52],[.84,.54]],
  '3-5-2':   [[.25,.82],[.50,.85],[.75,.82], [.08,.65],[.30,.68],[.50,.71],[.70,.68],[.92,.65], [.38,.53],[.62,.53]],
  '4-2-3-1': [...D4, [.38,.71],[.62,.71], [.16,.60],[.50,.61],[.84,.60], [.50,.52]],
};
const formOf = t => FORM[t.formation] ? t.formation : '4-4-2';
const slotRole = (t, i) => { if (i === 0) return 'Goleiro'; if (i === 11) return 'Goleiro reserva'; if (i > 11) return 'Reserva'; const y = FORM[formOf(t)][i - 1][1]; return y > .76 ? 'Defesa' : y > .58 ? 'Meio' : 'Ataque'; };
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.4;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ad = s => s === 0 ? -1 : 1;
const oppGoal = s => ({ x: W / 2, y: s === 0 ? 0 : H });
const ownGoal = s => ({ x: W / 2, y: s === 0 ? H : 0 });
const pOvr = p => Math.round((p.vel + p.chu + p.def) / 3);

/* escalação do jogo: titular lesionado dá lugar ao melhor reserva disponível */
function lineup(t) {
  const xi = t.players.slice(0, 11), bench = t.players.slice(11), used = new Set();
  for (let i = 0; i < 11; i++) {
    if (!(xi[i].inj > 0)) continue;
    const c = bench.filter(p => !(p.inj > 0) && !used.has(p) && (i === 0 ? p.gk : !p.gk)).sort((a, b) => pOvr(b) - pOvr(a))[0]
      || bench.filter(p => !(p.inj > 0) && !used.has(p)).sort((a, b) => pOvr(b) - pOvr(a))[0];
    if (c) { used.add(c); xi[i] = c; }
  }
  return xi;
}
function createMatch(tU, tD, aiSides, comp) {
  const m = { t: 0, score: [0, 0], events: [], freeze: 0, teams: [tU, tD], bodies: [], tactic: [0, 0], comp,
    aiSides, lastBall: { x: W / 2, y: H / 2 }, lastTouch: null, over: false, onGoal: null, onHalf: null };

  lib: { name: 'Copa Libertadores', short: 'Libertadores', kind: 'grp', after: [5, 11, 17, 23, 29, 34], stages: ['Grupos · 1ª rodada', 'Grupos · 2ª rodada', 'Grupos · 3ª rodada', 'Quartas de final', 'Semifinal', 'Final'], win: 1200, champ: 12000 },
  sul: { name: 'Copa Sul-Americana', short: 'Sul-Americana', kind: 'grp', after: [6, 12, 18, 24, 30, 35], stages: ['Grupos · 1ª rodada', 'Grupos · 2ª rodada', 'Grupos · 3ª rodada', 'Quartas de final', 'Semifinal', 'Final'], win: 700, champ: 6000 },

/* ================= JOGADORES E TIMES ================= */
function makePlayer(base, o = {}) {
  const st = () => clamp(Math.round(base + rnd(-6, 6)), 20, 99);
  const age = o.age != null ? o.age : rint(19, 33);
  const p = { name: o.name || pick(PNAMES), num: o.num || 0, age, vel: st(), chu: st(), def: st(), inj: 0, g: {}, gk: !!o.gk };
  if (p.gk) p.def = clamp(p.def + 6, 20, 99);
  p.pot = o.pot || clamp(Math.max(p.vel, p.chu, p.def) + (age <= 23 ? rint(4, 18) : 0), 30, 99);
  return p;
}
function makeSquad(base, names) {
  const used = new Set((names || []).filter(Boolean));
  const nm = i => { let n = names && names[i]; if (!n) { n = pick(PNAMES); for (let g = 0; used.has(n) && g < 60; g++) n = pick(PNAMES); } used.add(n); return n; };
  return Array.from({ length: 16 }, (_x, i) => makePlayer(i < 11 ? base : base - 4, { name: nm(i), num: i + 1, gk: i === 0 || i === 11 }));
}
function makeProspect(base) {
  const p = makePlayer(base - 14, { name: `${pick(YNAMES)} ${pick(YSUR)}`, age: rint(16, 17), gk: Math.random() < .15 });
  p.pot = rint(58, 93); p.young = true;
  return p;
}
function makeTeam(club, div, id, base) {
  const [name, ab, c1, c2, pt, sname, scap] = club;
  const st = STADIUMS[ab] || [sname || 'Estádio Municipal', scap || 10000];
  return { id, name, abbr: ab, c1, c2, pt: pt || '', formation: pick(Object.keys(FORM)), players: makeSquad(base, SQUADS[ab]),
    stadium: { name: st[0], cap: st[1], comfort: 0 } };
}
function value(p) {
  const f = p.age <= 21 ? 1.4 : p.age <= 27 ? 1.15 : p.age <= 31 ? .9 : .55;
  return Math.round(Math.pow(pOvr(p), 2.6) / 40 * f * 3 / 10) * 10;
}
const salary = p => Math.round(value(p) / 200);
const ovr = t => Math.round(lineup(t).reduce((a, p) => a + pOvr(p), 0) / 11);

/* ================= CARREIRA ================= */
const KEY = 'liga-bolinhas-v3';
let S = null;
const T = id => S.teams[id];
const userDiv = () => DIVS.find(d => S.divisions[d].includes('user'));
const teamDiv = id => DIVS.find(d => S.divisions[d].includes(id)) || 'X';

function roundRobin(ids) {
  const arr = shuffle(ids), n = arr.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) { const a = arr[i], b = arr[n - 1 - i]; pairs.push(r % 2 ? [b, a] : [a, b]); }
    rounds.push(pairs); arr.splice(1, 0, arr.pop());
  }
  return rounds.concat(rounds.map(rd => rd.map(([a, b]) => [b, a])));
}
/* ch = { real: [divisão, índice] } ou { own: time, replace: índice na Série C } */
function newCareer(ch) {
  S = { v: 3, season: 1, money: 0, teams: {}, divisions: { A: [], B: [], C: [] }, foreign: { lib: [], sul: [] }, cups: {}, cal: [], ci: 0,
    fixtures: {}, results: {}, history: [], news: [], sponsor: null, offers: [], ticket: 'normal', build: null, market: [], ledger: {},
    log: [], form: [], youth: [], tutDone: false, qualified: { lib: [], sul: [] }, lastGate: null, leader: {}, titles: [] };
  let k = 0;
  for (const d of DIVS) CLUBS[d].forEach((club, i, arr) => {
    if (ch.own && d === 'C' && i === ch.replace) { S.teams.user = ch.own; S.divisions.C.push('user'); return; }
    const id = ch.real && ch.real[0] === d && ch.real[1] === i ? 'user' : 't' + k++;
    S.teams[id] = makeTeam(club, d, id, DIVBASE[d] + 6 - 12 * i / (arr.length - 1));
    S.divisions[d].push(id);
  });
  for (const c of ['lib', 'sul']) FOREIGN[c].forEach((club, i) => {
    const id = 'x' + c + i; S.teams[id] = makeTeam(club, 'X', id, c === 'lib' ? 70 : 64); S.foreign[c].push(id);
  });
  S.qualified = { lib: S.divisions.A.slice(0, 8), sul: S.divisions.A.slice(8, 16) };
  S.money = ECON.start[userDiv()];
  S.youth = [0, 1, 2].map(() => makeProspect(DIVBASE[userDiv()]));
  startSeason();
}
function startSeason() {
  for (const d of DIVS) { S.fixtures[d] = roundRobin(S.divisions[d]); S.results[d] = []; }
  for (const t of Object.values(S.teams)) for (const p of t.players) { p.g = {}; p.inj = 0; }
  S.ledger = {}; S.log = []; S.ci = 0; S.leader = {};
  // Copa do Brasil: Série A inteira, 8 da B e 4 da C
  let cdb = S.divisions.A.concat(S.divisions.B.slice(0, 8), S.divisions.C.slice(0, 4));
  if (!cdb.includes('user')) cdb[cdb.length - 1] = 'user';
  S.cups.cdb = { id: 'cdb', teams: cdb, alive: shuffle(cdb), results: [], champion: null };
  for (const c of ['lib', 'sul']) {
    const br = shuffle(S.qualified[c]), fo = shuffle(S.foreign[c]);
    const groups = [0, 1, 2, 3].map(g => [br[g * 2], fo[g * 2], br[g * 2 + 1], fo[g * 2 + 1]]);
    S.cups[c] = { id: c, teams: br.concat(fo), groups, alive: null, results: [], champion: null };
  }
  S.cal = [];
  for (let r = 0; r < 38; r++) {
    S.cal.push({ k: 'liga', r });
    for (const c of ['cdb', 'lib', 'sul']) { const st = CUPS[c].after.indexOf(r); if (st >= 0) S.cal.push({ k: 'cup', c, st }); }
  }
  if (!S.sponsor) S.offers = genOffers();
  refreshMarket();
  news(`Começa a temporada ${S.season}. ${T('user').name} disputa a ${DIVNAME[userDiv()]}${['lib', 'sul', 'cdb'].filter(c => S.cups[c].teams.includes('user')).map(c => `, a ${CUPS[c].name}`).join('')}.`, 'Temporada');
  advanceAuto();
}
function genOffers() {
  const d = userDiv(), b = { A: 220, B: 100, C: 45 }[d];
  return shuffle(SPONSORS).slice(0, 3).map((n, i) => ({ name: n, per: Math.round(b * rnd(.8, 1.3)), win: Math.round(b * rnd(.4, .9)), len: i + 1 }));
}
function news(text, tag) {
  S.news.unshift({ s: S.season, when: curLabel(), text, tag });
  if (S.news.length > 120) S.news.length = 120;
}
function curLabel() {
  const it = S.cal[Math.min(S.ci, S.cal.length - 1)];
  if (!it) return 'Pré-temporada';
  return it.k === 'liga' ? `Rodada ${it.r + 1}` : `${CUPS[it.c].short} · ${CUPS[it.c].stages[it.st]}`;
}
function itemLabel(it) {
  return it.k === 'liga' ? `${DIVNAME[userDiv()]} · Rodada ${it.r + 1} de 38` : `${CUPS[it.c].name} · ${CUPS[it.c].stages[it.st]}`;
}
function addMoney(v, cat) { S.money += v; S.ledger[cat] = (S.ledger[cat] || 0) + v; }

/* ---------- copas ---------- */
function isKO(it) { return it.k === 'cup' && !(CUPS[it.c].kind === 'grp' && it.st < 3); }
function cupPairs(c, st) {
  const cup = S.cups[c];
  if (CUPS[c].kind === 'grp' && st < 3) {
    const md = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]][st];
    return cup.groups.flatMap(g => md.map(([i, j]) => [g[i], g[j]]));
  }
  const al = cup.alive || [], pairs = [];
  for (let i = 0; i + 1 < al.length; i += 2) pairs.push([al[i], al[i + 1]]);
  return pairs;
}
function groupTable(c, g) {
  const rows = {}; for (const id of g) rows[id] = { id, pts: 0, sg: 0, gp: 0, j: 0 };
  for (const list of S.cups[c].results.slice(0, 3)) for (const r of list || []) {
    if (!rows[r.h] || !rows[r.a]) continue;
    const h = rows[r.h], a = rows[r.a]; h.j++; a.j++;
    h.gp += r.hg; a.gp += r.ag; h.sg += r.hg - r.ag; a.sg += r.ag - r.hg;
    if (r.hg > r.ag) h.pts += 3; else if (r.hg < r.ag) a.pts += 3; else { h.pts++; a.pts++; }
  }
  return Object.values(rows).sort((x, y) => y.pts - x.pts || y.sg - x.sg || y.gp - x.gp);
}
function inCup(c) { const cup = S.cups[c]; return cup.teams.includes('user') && !cup.champion && (cup.alive ? cup.alive.includes('user') : true); }
function pairsOf(it) { return it.k === 'liga' ? S.fixtures[userDiv()][it.r] : cupPairs(it.c, it.st); }
function involvesUser(it) { return pairsOf(it).some(p => p.includes('user')); }

/* ---------- processamento de rodadas ---------- */
function advanceAuto() {
  while (S.ci < S.cal.length && !involvesUser(S.cal[S.ci])) { processItem(S.cal[S.ci], null); S.ci++; }
}
function tickInjuries() { for (const t of Object.values(S.teams)) for (const p of t.players) if (p.inj > 0) p.inj--; }
function injuriesAfter(t) {
  for (const p of lineup(t)) if (Math.random() < .012) {
    const n = rint(1, 6); p.inj = n + 1;
    if (t.id === 'user') news(`${p.name} se lesionou e deve ficar fora por ${n} jogo${n > 1 ? 's' : ''}.`, 'Lesão');
    else if (pOvr(p) >= 76 && Math.random() < .5) news(`Desfalque no ${t.name}: ${p.name} sofreu uma lesão e fica fora por ${n} jogo${n > 1 ? 's' : ''}.`, 'Lesão');
  }
}
function gate(isCup) {
  const st = T('user').stadium, [price, adj] = ECON.ticket[S.ticket];
  const wins = S.form.slice(-5).filter(x => x === 'V').length, losses = S.form.slice(-5).filter(x => x === 'D').length;
  const fill = clamp(ECON.fill[userDiv()] + (wins - losses) * .03 + adj + st.comfort * .06 + (isCup ? .15 : 0) + rnd(-.05, .05), .15, 1);
  const att = Math.round(st.cap * fill), inc = Math.round(att * price / 1000);
  S.lastGate = { att, inc, cap: st.cap };
  addMoney(inc, 'Bilheteria');
  return inc;
}
function scorerText(evs, side) {
  const c = {}; for (const e of evs || []) if (e.side === side && !e.own && e.name) c[e.name] = (c[e.name] || 0) + 1;
  const parts = Object.entries(c).map(([n, k]) => k > 1 ? `${n} (${k})` : n);
  return parts.length ? ` Gols de ${parts.join(', ')}.` : '';
}
/* ures = resultado da partida do usuário { hg, ag, ph?, pa?, events } */
function processItem(it, ures) {
  tickInjuries();
  const info = { prize: 0, gate: 0 };
  if (it.k === 'liga') {
    for (const d of DIVS) {
      const list = [];
      for (const [h, a] of S.fixtures[d][it.r]) {
        let res;
        if (h === 'user' || a === 'user') res = { h, a, hg: ures.hg, ag: ures.ag };
        else { const m = simulate(T(h), T(a), 'liga'); res = { h, a, hg: m.score[0], ag: m.score[1] }; }
        injuriesAfter(T(h)); injuriesAfter(T(a));
        list.push(res);
        if (d === 'A' && Math.abs(res.hg - res.ag) >= 4 && res.h !== 'user' && res.a !== 'user')
          news(`Goleada na Série A: ${T(h).name} ${res.hg} x ${res.ag} ${T(a).name}.`, 'Resultado');
      }
      S.results[d].push(list);
      const lead = standings(d)[0].id;
      if (it.r >= 4 && S.leader[d] && S.leader[d] !== lead && (d === 'A' || d === userDiv())) news(`${T(lead).name} assume a liderança da ${DIVNAME[d]}.`, 'Tabela');
      S.leader[d] = lead;
    }
    // finanças do usuário
    const d = userDiv(), r = S.results[d][it.r].find(x => x.h === 'user' || x.a === 'user');
    const home = r.h === 'user', gf = home ? r.hg : r.ag, ga = home ? r.ag : r.hg, win = gf > ga;
    info.prize = Math.round((win ? 400 : gf === ga ? 150 : 0) * ECON.mult[d]);
    addMoney(info.prize, 'Premiações');
    addMoney(ECON.tv[d], 'Cotas de TV');
    if (S.sponsor) { addMoney(S.sponsor.per + (win ? S.sponsor.win : 0), 'Patrocínio'); }
    addMoney(-T('user').players.reduce((a, p) => a + salary(p), 0), 'Salários');
    if (home) info.gate = gate(false);
    S.form.push(win ? 'V' : gf === ga ? 'E' : 'D'); if (S.form.length > 10) S.form.shift();
    // obras
    if (S.build) {
      S.build.left--;
      if (S.build.left <= 0) {
        const st = T('user').stadium;
        if (S.build.type === 'cap') { st.cap += CAP_STEP; news(`Obras concluídas: o ${st.name} agora recebe ${st.cap.toLocaleString('pt-BR')} torcedores.`, 'Estádio'); }
        else { st.comfort++; news(`Modernização concluída no ${st.name}. Mais conforto atrai mais público.`, 'Estádio'); }
        S.build = null;
      }
    }
    aiTransfers();
    refreshMarket();
  } else {
    const c = it.c, cfg = CUPS[c], cup = S.cups[c], ko = isKO(it), list = [];
    for (const [h, a] of cupPairs(c, it.st)) {
      let res;
      if (h === 'user' || a === 'user') res = { h, a, hg: ures.hg, ag: ures.ag, ph: ures.ph, pa: ures.pa };
      else {
        const m = simulate(T(h), T(a), c); res = { h, a, hg: m.score[0], ag: m.score[1] };
        if (ko && res.hg === res.ag) [res.ph, res.pa] = shootout(T(h), T(a));
      }
      injuriesAfter(T(h)); injuriesAfter(T(a));
      if (ko) res.w = res.hg > res.ag || (res.hg === res.ag && res.ph > res.pa) ? h : a;
      list.push(res);
    }
    cup.results[it.st] = list;
    const mine = list.find(x => x.h === 'user' || x.a === 'user');
    if (mine && mine.h === 'user') info.gate = gate(true);
    if (ko) {
      cup.alive = list.map(r => r.w);
      if (mine) {
        if (mine.w === 'user') { info.prize = cfg.win; addMoney(cfg.win, 'Premiações'); if (cup.alive.length > 1) news(`${T('user').name} avança na ${cfg.name}!`, cfg.short); }
        else news(`${T('user').name} é eliminado da ${cfg.name} na fase: ${cfg.stages[it.st]}.`, cfg.short);
      }
      if (cup.alive.length === 1) {
        cup.champion = cup.alive[0];
        news(`${T(cup.champion).name} é campeão da ${cfg.name}!`, cfg.short);
        if (cup.champion === 'user') { addMoney(cfg.champ, 'Premiações'); info.prize += cfg.champ; S.titles.push(`${cfg.name} ${S.season}`); }
      }
    } else {
      if (mine) { const gf = mine.h === 'user' ? mine.hg : mine.ag, ga = mine.h === 'user' ? mine.ag : mine.hg; if (gf > ga) { info.prize = 300; addMoney(300, 'Premiações'); } }
      if (it.st === 2) {
        const [A, B, C, D] = cup.groups.map(g => groupTable(c, g).map(r => r.id));
        cup.alive = [A[0], B[1], B[0], A[1], C[0], D[1], D[0], C[1]];
        if (cup.teams.includes('user')) news(cup.alive.includes('user') ? `${T('user').name} se classifica para as quartas da ${cfg.name}.` : `${T('user').name} cai na fase de grupos da ${cfg.name}.`, cfg.short);
      }
    }
  }
  return info;
}
function standings(d) {
  const rows = {};
  for (const id of S.divisions[d]) rows[id] = { id, j: 0, v: 0, e: 0, dr: 0, gp: 0, gc: 0, pts: 0 };
  for (const rd of S.results[d]) for (const r of rd) {
    const h = rows[r.h], a = rows[r.a]; if (!h || !a) continue;
    h.j++; a.j++; h.gp += r.hg; h.gc += r.ag; a.gp += r.ag; a.gc += r.hg;
    if (r.hg > r.ag) { h.v++; a.dr++; h.pts += 3; } else if (r.hg < r.ag) { a.v++; h.dr++; a.pts += 3; } else { h.e++; a.e++; h.pts++; a.pts++; }
  }
  return Object.values(rows).sort((x, y) => y.pts - x.pts || y.v - x.v || (y.gp - y.gc) - (x.gp - x.gc) || y.gp - x.gp);
}
function aiTransfers() {
  if (Math.random() > .3) return;
  const buyer = T(pick(S.divisions.A.filter(id => id !== 'user')));
  const sellerId = pick(S.divisions[pick(['B', 'C'])].filter(id => id !== 'user')); if (!sellerId) return;
  const seller = T(sellerId);
  const si = 1 + [...Array(10).keys()].sort((a, b) => pOvr(seller.players[b + 1]) - pOvr(seller.players[a + 1]))[0];
  const bi = 1 + [...Array(10).keys()].sort((a, b) => pOvr(buyer.players[a + 1]) - pOvr(buyer.players[b + 1]))[0];
  const p = seller.players[si];
  if (pOvr(p) <= pOvr(buyer.players[bi])) return;
  [seller.players[si], buyer.players[bi]] = [buyer.players[bi], seller.players[si]];
  news(`${buyer.name} contrata ${p.name}, destaque do ${seller.name}.`, 'Mercado');
}
function refreshMarket() {
  const pool = DIVS.flatMap(d => S.divisions[d]).filter(id => id !== 'user');
  S.market = Array.from({ length: 10 }, () => { const tid = pick(pool); return { tid, i: rint(1, 15) }; });
}
function endSeason() {
  const tables = {}; for (const d of DIVS) tables[d] = standings(d).map(r => r.id);
  const ud = userDiv(), pos = tables[ud].indexOf('user') + 1;
  const top = d => tables[d].slice(0, 4), bot = d => tables[d].slice(-4);
  const sum = { season: S.season, div: ud, pos, move: '' };
  if (ud !== 'A' && pos <= 4) { sum.move = 'up'; addMoney(ECON.promo, 'Premiações'); }
  if (ud !== 'C' && pos > tables[ud].length - 4) sum.move = 'down';
  if (pos === 1) { addMoney(ECON.title[ud], 'Premiações'); S.titles.push(`${DIVNAME[ud]} ${S.season}`); }
  for (const d of DIVS) news(`${T(tables[d][0]).name} é campeão da ${DIVNAME[d]} ${S.season}!`, 'Campeão');
  // vagas continentais
  const A = tables.A.filter(id => !bot('A').includes(id));
  let lib = A.slice(0, 8), sul = A.slice(8, 16);
  const cdbC = S.cups.cdb.champion;
  if (cdbC && !lib.includes(cdbC)) { sul = [lib[7], ...sul.filter(x => x !== cdbC)].slice(0, 8); lib = lib.slice(0, 7).concat(cdbC); }
  S.qualified = { lib, sul };
  S.divisions = {
    A: tables.A.filter(id => !bot('A').includes(id)).concat(top('B')),
    B: bot('A').concat(tables.B.filter(id => !top('B').includes(id) && !bot('B').includes(id))).concat(top('C')),
    C: bot('B').concat(tables.C.filter(id => !top('C').includes(id))),
  };
  // evolução, idade e aposentadorias
  for (const t of Object.values(S.teams)) {
    const d = teamDiv(t.id), base = d === 'X' ? 66 : DIVBASE[d];
    t.players = t.players.map(p => {
      grow(p);
      if (p.age >= 36 || (p.age >= 34 && Math.random() < .3)) {
        const np = makeProspect(base + 6); np.age = 18; np.num = p.num; np.gk = p.gk;
        if (t.id === 'user') news(`${p.name} se aposenta. ${np.name}, da base, assume a vaga no elenco.`, 'Elenco');
        return np;
      }
      return p;
    });
    if (t.id !== 'user' && Math.random() < .5) {
      const worst = 11 + [...Array(5).keys()].sort((a, b) => pOvr(t.players[a + 11]) - pOvr(t.players[b + 11]))[0];
      const np = makeProspect(base + 8); np.num = t.players[worst].num; np.gk = t.players[worst].gk; t.players[worst] = np;
      if (d === 'A' && Math.random() < .3) news(`${t.name} promove o jovem ${np.name}, revelação da base.`, 'Base');
    }
  }
  S.youth.forEach(p => { grow(p); p.age--; grow(p); });
  S.youth = S.youth.concat([0, 1, 2].map(() => makeProspect(DIVBASE[teamDiv('user')]))).slice(-8);
  if (S.sponsor) { S.sponsor.len--; if (S.sponsor.len <= 0) { news(`Acabou o contrato com ${S.sponsor.name}. Escolha um novo patrocinador.`, 'Patrocínio'); S.sponsor = null; } }
  S.history.push(sum);
  S.season++;
  startSeason();
  return sum;
}
function grow(p) {
  p.age++;
  for (const k of ['vel', 'chu', 'def']) {
    if (p.age <= 23) p[k] = Math.min(99, p.pot, p[k] + Math.max(0, Math.round(rnd(0, 3) + (p.pot - pOvr(p)) / 10)));
    else if (p.age >= 31) p[k] = Math.max(20, p[k] - rint(0, 3));
  }

function drawFormation(c, f) {
  const x = c.getContext('2d'); x.clearRect(0, 0, 90, 120);
  x.fillStyle = '#2a733b'; x.fillRect(0, 0, 90, 120);
  x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 1.5; x.strokeRect(4, 4, 82, 112);
  x.beginPath(); x.moveTo(4, 60); x.lineTo(86, 60); x.stroke();
  for (const [fx, fy] of [[.5, .93]].concat(FORM[f])) { x.beginPath(); x.arc(4 + fx * 82, 4 + (fy * 2.4 - 1.3) * 112, 4.5, 0, 7); x.fillStyle = '#ffb547'; x.fill(); }
}

/* ================= AÇÕES ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act], [data-tab]'); if (!b || b.disabled) return;
  if (b.dataset.tab) { tab = b.dataset.tab; viewDiv = null; editId = null; render(); return; }
  const a = b.dataset.act, v = b.dataset.v, i = +b.dataset.i;
  if (a === 'mode') { readDraft(); draft.mode = b.dataset.m; render(); }
  else if (a === 'real') { draft.real = [b.dataset.d, i]; render(true); }
  else if (a === 'pt') { readDraft(); draft.pt = v; render(true); }
  else if (a === 'color') { readDraft(); draft[b.dataset.k] = b.dataset.c; render(true); }
  else if (a === 'form') { if (S) { T('user').formation = b.dataset.f; save(); } else { readDraft(); draft.formation = b.dataset.f; } render(true); }
  else if (a === 'create') {
    readDraft();
    if (draft.mode === 'real') newCareer({ real: draft.real });
    else newCareer({ replace: draft.replace, own: { id: 'user', name: draft.name, abbr: draft.abbr, c1: draft.c1, c2: draft.c2, pt: draft.pt, formation: draft.formation,
      players: makeSquad(DIVBASE.C, draft.names), stadium: { name: 'Estádio Municipal', cap: 8000, comfort: 0 } } });
    save(); tab = 'home'; render(); startTutorial();
  }
  else if (a === 'goto') { tab = v; render(); }
  else if (a === 'sub-comp') { sub.comp = v; editId = null; render(); }
  else if (a === 'sub-cup') { sub.cup = v; render(true); }
  else if (a === 'sub-art') { sub.art = v; render(true); }
  else if (a === 'sub-squad') { sub.squad = v; expP = expY = expM = null; render(); }
  else if (a === 'div') { viewDiv = v; render(true); }
  else if (a === 'edit') { editId = b.dataset.id; render(); }
  else if (a === 'ecolor') { readEdit(); T(editId)[b.dataset.k] = b.dataset.c; save(); render(true); }
  else if (a === 'ept') { readEdit(); T(editId).pt = v; save(); render(true); }
  else if (a === 'esave') { readEdit(); save(); editId = null; render(); }
  else if (a === 'eclose') { editId = null; render(); }
  else if (a === 'expP') { expP = expP === i ? null : i; render(true); }
  else if (a === 'expY') { expY = expY === i ? null : i; render(true); }
  else if (a === 'expM') { expM = expM === i ? null : i; render(true); }
  else if (a === 'up') {
    const p = T('user').players[i], k = b.dataset.k, c = trainCost(p[k]);
    if (S.money >= c && p[k] < 99) { addMoney(-c, 'Treinos'); p[k]++; save(); render(true); }
  }
  else if (a === 'promo') {
    const out = +$('promo-sel').value, u = T('user'), p = S.youth[i], old = u.players[out];
    p.num = old.num; p.young = false; u.players[out] = p; S.youth.splice(i, 1); expY = null;
    news(`${p.name}, ${p.age} anos, é promovido da base para o elenco principal. ${old.name} deixa o clube.`, 'Base');
    save(); render(true);
  }
  else if (a === 'dismiss') { S.youth.splice(i, 1); expY = null; save(); render(true); }
  else if (a === 'buy') {
    const m = S.market[i], t = T(m.tid), p = t.players[m.i], price = buyPrice(p), out = +$('buy-out').value, u = T('user');
    if (S.money < price) return;
    const old = u.players[out];
    addMoney(-price, 'Contratações');
    [old.num, p.num] = [p.num, old.num];
    u.players[out] = p; t.players[m.i] = old;
    news(`${u.name} contrata ${p.name}, do ${t.name}, por ${brl(price)}. ${old.name} vai para o ${t.name} na negociação.`, 'Mercado');
    S.market.splice(i, 1); expM = null; save(); render(true);
  }
  else if (a === 'ticket') { S.ticket = v; save(); render(true); }
  else if (a === 'build') {
    const cost = v === 'cap' ? CAP_COST : COMF_COST, time = v === 'cap' ? CAP_TIME : COMF_TIME;
    if (S.money < cost || S.build) return;
    addMoney(-cost, 'Obras'); S.build = { type: v, left: time, total: time };
    news(v === 'cap' ? `Começam as obras de ampliação do ${T('user').stadium.name}.` : `Começa a modernização do ${T('user').stadium.name}.`, 'Estádio');
    save(); render(true);
  }
  else if (a === 'spon') { const o = S.offers[i]; S.sponsor = { ...o }; S.offers = []; news(`${T('user').name} fecha patrocínio master com ${o.name} por ${o.len} temporada${o.len > 1 ? 's' : ''}.`, 'Patrocínio'); save(); render(true); }
  else if (a === 'play') openMatch();
  else if (a === 'quick') quickMatch();
  else if (a === 'newseason') { endSeason(); save(); render(); }
  else if (a === 'tutorial') { tab = 'home'; render(); startTutorial(true); }
  else if (a === 'reset1') { $('resetBox').innerHTML = '<button class="btn small" data-act="reset2" style="background:var(--bad);color:#2a0606;border-color:var(--bad)">Apagar tudo</button><button class="btn small" data-act="reset0">Cancelar</button>'; }
  else if (a === 'reset0') render(true);
  else if (a === 'reset2') { S = null; try { localStorage.removeItem(KEY); } catch (err) {} tab = 'home'; render(); }
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset.act; if (!S || !a) return;
  if (a === 'rename') { const p = T('user').players[+t.dataset.i]; p.name = t.value.trim() || p.name; save(); }
  else if (a === 'stadname') { T('user').stadium.name = t.value.trim() || T('user').stadium.name; save(); }
  else if (a === 'swap' && t.value !== '') {
    const u = T('user'), i = +t.dataset.i, j = +t.value;
    [u.players[i], u.players[j]] = [u.players[j], u.players[i]]; expP = null; save(); render(true);
  }
});

/* ================= PARTIDA ================= */
function finishUserMatch(ev, score, events) {
  const home = ev.home === 'user';
  const ures = { hg: score[0], ag: score[1], events };
  if (!home) [ures.hg, ures.ag] = [score[1], score[0]];
  if (isKO(ev.it) && ures.hg === ures.ag) [ures.ph, ures.pa] = shootout(T(ev.home), T(ev.away));
  const label = itemLabel(ev.it);
  const info = processItem(ev.it, ures);
  S.log.push({ label, h: ev.home, a: ev.away, hg: ures.hg, ag: ures.ag, ph: ures.ph, pa: ures.pa });
  const gf = home ? ures.hg : ures.ag, ga = home ? ures.ag : ures.hg;
  const res = gf > ga ? 'vence' : gf < ga ? 'perde para' : 'empata com';
  news(`${T('user').name} ${res} o ${T(ev.opp).name}: ${T(ev.home).abbr} ${ures.hg} x ${ures.ag} ${T(ev.away).abbr}${ures.ph != null ? ` (pênaltis ${ures.ph}-${ures.pa})` : ''}.${scorerText(events, 0)}`, 'Seu jogo');
  S.ci++;
  advanceAuto();
  save();
  return { ...info, ures, gf, ga };
}
function quickMatch() {
  const ev = nextEvent(), m = simulate(T(ev.home), T(ev.away), compKey(ev.it));
  const evs = m.events.map(e => ({ ...e, side: ev.home === 'user' ? e.side : 1 - e.side }));
  finishUserMatch(ev, ev.home === 'user' ? m.score : [m.score[1], m.score[0]], evs);
  render();
}
const compKey = it => it.k === 'liga' ? 'liga' : it.c;

const MX = 6, MY = 14, CW = W + MX * 2, CH = H + MY * 2;
const cv = $('pitch'), ctx = cv.getContext('2d');
let M = null, EV = null, speed = 1, pauseF = 0, flash = null, raf = 0, scale = 1;
function openMatch() {
  EV = nextEvent();
  const me = T('user'), op = T(EV.opp);
  M = createMatch(me, op, [1], compKey(EV.it));
  M.onGoal = ev => { pauseF = 70; flash = { text: 'GOL!', sub: ev.own ? `contra · ${ev.name}` : ev.name, side: ev.side, t: 70 }; updateBoard(); };
  M.onHalf = () => { pauseF = 80; flash = { text: 'INTERVALO', sub: '', side: -1, t: 80 }; };
  $('nU').textContent = me.abbr; $('nD').textContent = op.abbr;
  for (const [id, t] of [['bU', me], ['bD', op]]) { $(id).style.background = teamBg(t); $(id).style.borderColor = t.c2; }
  $('end').hidden = true; $('ctrl').style.visibility = 'visible';
  setSeg('tac', '0'); setSeg('spd', String(speed));
  $('feed').textContent = itemLabel(EV.it);
  $('match').hidden = false; $('app').setAttribute('aria-hidden', 'true');
  pauseF = 0; flash = null; updateBoard(); resize();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}
function setSeg(id, v) { document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); }
$('tac').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !M) return; M.tactic[0] = +b.dataset.v; setSeg('tac', b.dataset.v); });
$('spd').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; speed = +b.dataset.v; setSeg('spd', b.dataset.v); });
$('skip').addEventListener('click', () => { if (!M || M.over) return; M.onGoal = null; M.onHalf = null; while (!M.over) step(M); pauseF = 0; flash = null; });
function updateBoard() {
  $('sc').textContent = `${M.score[0]} - ${M.score[1]}`;
  $('clk').textContent = M.over ? 'Fim' : `${Math.min(90, Math.floor(M.t / 40))}'`;
  const evs = M.events.slice(-3).map(e => `${e.min}' ${M.teams[e.side].abbr} ${e.own ? e.name + ' (contra)' : e.name}`);
  if (evs.length) $('feed').textContent = evs.join('  ·  ');
}
function resize() {
  const pw = $('pw'), aw = pw.clientWidth, ah = pw.clientHeight;
  scale = Math.max(.5, Math.min(aw / CW, ah / CH));
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = CW * scale + 'px'; cv.style.height = CH * scale + 'px';
  cv.width = Math.round(CW * scale * dpr); cv.height = Math.round(CH * scale * dpr);
  if (M) draw();
}
window.addEventListener('resize', () => { if (!$('match').hidden) resize(); if (!$('tut').hidden) placeTut(); });
function loop() {
  if (!M) return;
  if (pauseF > 0) pauseF--;
  else if (!M.over) for (let i = 0; i < speed && !M.over && pauseF === 0; i++) step(M);
  if (flash) { flash.t--; if (flash.t <= 0) flash = null; }
  updateBoard(); draw();
  if (M.over && pauseF === 0) { showEnd(); return; }
  raf = requestAnimationFrame(loop);
}
function showEnd() {
  const r = finishUserMatch(EV, M.score, M.events);
  const title = r.gf > r.ga || (r.ures.ph != null && (EV.home === 'user' ? r.ures.ph > r.ures.pa : r.ures.pa > r.ures.ph)) ? 'Vitória!' : r.gf < r.ga || r.ures.ph != null ? 'Derrota' : 'Empate';
  const goals = M.events.map(e => `<span>${e.min}' ${esc(M.teams[e.side].abbr)} · ${e.own ? `${esc(e.name)} (contra)` : esc(e.name)}</span>`).join('');
  $('ctrl').style.visibility = 'hidden';
  $('end').innerHTML = `<div class="card">
    <span class="label">${title}</span>
    <div class="final">${M.score[0]} - ${M.score[1]}</div>
    ${r.ures.ph != null ? `<div><b>Pênaltis: ${EV.home === 'user' ? r.ures.ph : r.ures.pa} - ${EV.home === 'user' ? r.ures.pa : r.ures.ph}</b></div>` : ''}
    <div class="goals-list">${goals || '<span>Sem gols</span>'}</div>
    ${r.prize ? `<div class="reward"><span class="coin"></span>Prêmio ${brl(r.prize)}</div>` : ''}
    ${r.gate ? `<div class="reward"><span class="coin"></span>Bilheteria ${brl(r.gate)} · ${num(S.lastGate.att)} torcedores</div>` : ''}
    <button class="btn primary" id="cont">Continuar</button></div>`;
  $('end').hidden = false;
  $('cont').onclick = () => { $('match').hidden = true; $('app').removeAttribute('aria-hidden'); M = null; tab = 'home'; render(); };
}
function paintKit(c, x, y, r, c1, c2, pt) {
  c.save(); c.beginPath(); c.arc(x, y, r, 0, 7); c.clip();
  c.fillStyle = c1; c.fillRect(x - r, y - r, 2 * r, 2 * r); c.fillStyle = c2;
