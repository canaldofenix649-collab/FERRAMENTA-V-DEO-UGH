<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bolinhas">
<title>Liga das Bolinhas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: app de celular em uma coluna — cabeçalho fixo, conteúdo rolável, abas embaixo; partida em tela cheia */
:root {
  --night: #0a1a14;
  --panel: #10261d;
  --panel-2: #173528;
  --line: #25493a;
  --chalk: #eef5f0;
  --muted: #9cbcae;
  --club: #ffb547;
  --amber: #ffb547;
  --amber-ink: #2b1a00;
  --good: #4fd18b;
  --bad: #ff6b6b;
  --grass-1: #2f7f42;
  --grass-2: #2a733b;
  --f-display: "Bungee", "Arial Black", Impact, sans-serif;
  --f-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--chalk); font-family: var(--f-body); font-size: 15px;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--f-display); font-size: 15px; white-space: nowrap; letter-spacing: .02em; line-height: 1; }
.brand small { display: block; font-family: var(--f-body); font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.coins { white-space: nowrap; display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe19c, var(--amber) 60%, #c27a12); }
main { flex: 1; overflow-y: auto; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--night); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { background: none; border: 0; padding: 12px 4px 10px; font-size: 12px; font-weight: 500; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav.tabs button .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; }
nav.tabs button[aria-current="true"] { color: var(--amber); }
nav.tabs button[aria-current="true"] .dot { background: currentColor; }

h2 { font-family: var(--f-display); font-size: 16px; font-weight: 400; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.btn { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 700; font-size: 15px; background: var(--panel-2); border: 1px solid var(--line); }
.btn.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
.btn.small { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .4; cursor: default; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.badge { width: 28px; height: 28px; border-radius: 50%; flex: none; border: 4px solid; }
.badge.lg { width: 54px; height: 54px; border-width: 8px; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.vs .side { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.vs .name { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.vs .mid { font-family: var(--f-display); font-size: 20px; color: var(--muted); }
.ovr { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { background: none; border: 0; border-radius: 8px; padding: 8px 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--chalk); box-shadow: inset 0 0 0 1px var(--amber); }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
th { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; text-align: right; padding: 6px 4px; }
td { padding: 8px 4px; text-align: right; border-top: 1px solid var(--line); }
th:nth-child(2), td:nth-child(2) { text-align: left; }
td.pos { width: 26px; text-align: center; font-weight: 700; box-shadow: inset 3px 0 0 transparent; }
tr.up td.pos { box-shadow: inset 3px 0 0 var(--good); }
tr.down td.pos { box-shadow: inset 3px 0 0 var(--bad); }
tr.pre td.pos { box-shadow: inset 3px 0 0 var(--amber); }
tr.sa td.pos { box-shadow: inset 3px 0 0 #5aa9e6; }
tr.me td { background: rgba(255,181,71,.1); }
td .tn { display: flex; align-items: center; gap: 8px; min-width: 0; }
td .tn .badge { width: 16px; height: 16px; border-width: 3px; }
td.pts { font-weight: 700; color: var(--chalk); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.player { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; padding-top: 12px; border-top: 1px solid var(--line); }
.player:first-of-type { border-top: 0; padding-top: 0; }
.pnum { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; border: 3px solid; }
.pname { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pname input { background: transparent; border: 0; border-bottom: 1px dashed var(--line); padding: 2px 0; font-weight: 700; min-width: 0; width: 100%; }
.stats { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.stat { display: grid; grid-template-columns: 34px 1fr 28px auto; gap: 8px; align-items: center; font-size: 12px; }
.stat .k { color: var(--muted); font-weight: 500; letter-spacing: .06em; }
.bar { height: 6px; background: var(--night); border-radius: 3px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--amber); border-radius: 3px; }
.stat .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.plus { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 700; display: flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
.plus .coin { width: 10px; height: 10px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field input[type=text] { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.tn-btn { background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left; }
.tn-btn span:last-child { text-decoration: underline dotted var(--line); text-underline-offset: 3px; }
.clubs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.club-btn { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; text-align: left; font-size: 13px; font-weight: 500; min-width: 0; }
.club-btn .badge { width: 20px; height: 20px; border-width: 3px; }
.club-btn span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.club-btn[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.start-bar { position: sticky; bottom: 0; background: var(--panel); padding-top: 8px; }
.edit-row { display: grid; grid-template-columns: 1fr 90px; gap: 10px; }
.sw { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 2px solid var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--night), 0 0 0 5px var(--amber); }
.forms { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.form-btn { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
.form-btn[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.form-btn canvas { width: 100%; max-width: 70px; aspect-ratio: 3/4; }

.results { display: flex; flex-direction: column; }
.res { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.res:first-child { border-top: 0; }
.res .h { display: flex; justify-content: flex-end; align-items: center; gap: 6px; text-align: right; }
.res .a { display: flex; align-items: center; gap: 6px; }
.res .badge { width: 14px; height: 14px; border-width: 3px; }
.res .sc { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; background: var(--night); border-radius: 6px; padding: 3px 6px; }
.res.me { color: var(--amber); }
.round-h { display: flex; justify-content: space-between; align-items: baseline; }
.pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); }
.pill.w { background: var(--good); color: #062414; } .pill.d { background: var(--muted); color: #0c1d22; } .pill.l { background: var(--bad); color: #2a0606; }
.scorers li { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.scorers li:first-child { border-top: 0; }
.scorers ol { list-style: none; margin: 0; padding: 0; }

/* Partida */
.match { position: fixed; inset: 0; background: var(--night); display: flex; flex-direction: column; align-items: center; z-index: 20;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.board { width: 100%; max-width: 520px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 0 6px; }
.board .t { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 16px; min-width: 0; }
.board .t.r { justify-content: flex-end; }
.board .badge { width: 22px; height: 22px; border-width: 4px; }
.board .score { font-family: var(--f-display); font-size: 30px; font-variant-numeric: tabular-nums; text-align: center; line-height: 1; }
.board .clock { display: block; font-family: var(--f-body); font-size: 12px; color: var(--amber); font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.feed { width: 100%; max-width: 520px; min-height: 18px; font-size: 12px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pitch-wrap { flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; position: relative; }
#pitch { display: block; border-radius: 12px; touch-action: manipulation; }
.controls { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 8px; padding: 8px 0 12px; }
.controls .row > * { flex: 1; }
.endpanel { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(12,29,34,.82); padding: 16px; }
.endpanel .card { width: 100%; max-width: 380px; text-align: center; }
.final { font-family: var(--f-display); font-size: 40px; }
.goals-list { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.reward { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--amber); justify-content: center; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; }
nav.tabs { grid-template-columns: repeat(6, 1fr); }
.cop-g { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.cop-g.mine, .cop-row.mine { box-shadow: inset 3px 0 0 var(--amber); padding-left: 6px; }
.cop-t { display: flex; align-items: center; gap: 6px; justify-content: flex-end; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cop-t.r { justify-content: flex-start; }
.cop-s { font-family: var(--f-display); font-size: 15px; font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
.cop-x { grid-column: 1 / -1; font-size: 11px; color: var(--muted); text-align: center; }
.cop-row { display: grid; grid-template-columns: 1fr 28px 24px 30px 28px; gap: 6px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; font-variant-numeric: tabular-nums; }
.cop-row > span:not(.cop-t), .cop-row > b { text-align: center; }
.cop-row .cop-t { justify-content: flex-start; }
.cop-hd { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-top: 0; }
.tr-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.tr-row.mine { box-shadow: inset 3px 0 0 var(--amber); padding-left: 8px; }
.tr-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-cr { display: flex; align-items: center; gap: 2px; }
.tr-ar { color: var(--muted); font-size: 12px; }
.tr-fee { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; text-align: right; }
.mini-x { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.stat-grid div { display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
.stat-grid b { font-size: 15px; font-variant-numeric: tabular-nums; }
.mk-q { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; font: inherit; color: inherit; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--amber); font: inherit; font-size: 13px; font-weight: 500; text-align: left; }
nav.tabs button { font-size: 11px; padding-left: 2px; padding-right: 2px; }
.top-r { display: flex; align-items: center; gap: 8px; }
.help { width: 34px; height: 34px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); font-weight: 700; }
.money { font-variant-numeric: tabular-nums; }
.money.neg { color: var(--bad); }
.list { display: flex; flex-direction: column; }
.prow { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.list > :first-child { border-top: 0; }
.prow .pnum { width: 30px; height: 30px; font-size: 12px; border-width: 2px; }
.prow .nm { font-weight: 700; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .meta { font-size: 12px; color: var(--muted); }
.prow .ov { font-family: var(--f-display); font-size: 16px; font-variant-numeric: tabular-nums; }
.expand { padding: 4px 0 14px 40px; display: flex; flex-direction: column; gap: 10px; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; letter-spacing: .04em; text-transform: uppercase; background: var(--panel-2); color: var(--muted); vertical-align: 1px; }
.tag.inj { background: var(--bad); color: #2a0606; }
.tag.new { background: var(--good); color: #062414; }
.tag.gold { background: var(--amber); color: var(--amber-ink); }
.selrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; max-width: 100%; }
.news { display: flex; flex-direction: column; }
.news-item { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.news-item:first-child { border-top: 0; }
.news-item p { margin: 0; line-height: 1.4; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
.kv:first-child { border-top: 0; }
.kv b.pos { color: var(--good); } .kv b.neg { color: var(--bad); }
.progress { height: 8px; background: var(--night); border-radius: 4px; overflow: hidden; }
.progress b { display: block; height: 100%; background: var(--amber); }
.offer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.offer:first-child { border-top: 0; }
.big { font-family: var(--f-display); font-size: 26px; line-height: 1; }
.alert { border-color: var(--amber); }
.grp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grp table { font-size: 12px; }
@media (max-width: 420px) { .grp { grid-template-columns: 1fr; } }
/* tutorial */
.tut { position: fixed; inset: 0; z-index: 50; }
.tut .spot { position: fixed; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(4,12,14,.78); outline: 2px solid var(--amber); transition: all .25s ease; pointer-events: none; }
.tut .bubble { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); max-width: 440px; margin: 0 auto; background: var(--panel); border: 1px solid var(--amber); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.tut .bubble h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.tut .bubble p { margin: 0; line-height: 1.45; }
.tut .steps { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.crest { flex: none; display: inline-block; vertical-align: middle; }
.crest img { width: 100%; height: 100%; object-fit: contain; display: block; }
.badge { display: none; }
.meter { height: 8px; background: var(--night); border-radius: 4px; overflow: hidden; }
.meter b { display: block; height: 100%; border-radius: 4px; }
.stars { color: var(--amber); letter-spacing: 1px; }
.stats-t { width: 100%; font-size: 13px; }
.stats-t td { text-align: center; padding: 5px 4px; }
.stats-t td:nth-child(2) { color: var(--muted); font-size: 12px; text-align: center; }
.overlay { position: absolute; inset: 0; background: rgba(12,29,34,.92); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.overlay .card { width: 100%; max-width: 420px; margin: 0 auto; }
.subrow { display: grid; grid-template-columns: 1fr 70px; gap: 8px; align-items: center; padding: 8px; border-radius: 10px; background: var(--night); border: 1px solid var(--line); text-align: left; width: 100%; }
.subrow[aria-pressed="true"] { border-color: var(--amber); }
.ctrl-row { display: flex; gap: 6px; }
.ctrl-row .btn { flex: 1; padding: 8px 6px; font-size: 12px; }
.ctrl-row .seg { flex: 2; }
.pos-tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 5px; background: var(--night); border: 1px solid var(--line); color: var(--muted); }
.pos-tag.bad { border-color: var(--bad); color: var(--bad); }
.award { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.award:first-child { border-top: 0; }
.file-btn { position: relative; overflow: hidden; }
body { background-color: var(--night); background-image: repeating-linear-gradient(180deg, rgba(255,255,255,.022) 0 64px, transparent 64px 128px); }
.top { border-bottom: 3px solid var(--club); background: linear-gradient(180deg, rgba(255,255,255,.04), transparent); }
.top .brand { display: flex; align-items: center; gap: 10px; min-width: 0; overflow: hidden; font-size: 13px; }
.top .brand > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.top-r { flex: none; }
main > * { flex-shrink: 0; }
.top .brand .crest { width: 34px; height: 34px; }
.card { background: linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 85%, black)); }
nav.tabs button svg { width: 22px; height: 22px; }

<script>
(() => {
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.4;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* =====================================================================
   POSIÇÕES E ATRIBUTOS
   ===================================================================== */
const ATTRS = [['vel', 'VEL', 'Velocidade'], ['chu', 'CHU', 'Chute'], ['pas', 'PAS', 'Passe'], ['dri', 'DRI', 'Drible'], ['def', 'DEF', 'Defesa'], ['cab', 'CAB', 'Cabeceio'], ['ref', 'REF', 'Reflexo']];
const POSW = {
  GOL: { ref: .45, def: .3, vel: .1, pas: .15 }, ZAG: { def: .45, cab: .25, vel: .15, pas: .15 }, LAT: { vel: .3, def: .3, pas: .25, dri: .15 },
  VOL: { def: .35, pas: .35, vel: .15, chu: .15 }, MEI: { pas: .4, dri: .25, chu: .2, vel: .15 }, PON: { vel: .35, dri: .35, chu: .15, pas: .15 }, CA: { chu: .45, cab: .2, vel: .2, dri: .15 },
};
const POSN = { GOL: 'Goleiro', ZAG: 'Zagueiro', LAT: 'Lateral', VOL: 'Volante', MEI: 'Meia', PON: 'Ponta', CA: 'Centroavante' };
const NEAR = new Set(['ZAG-LAT', 'ZAG-VOL', 'LAT-PON', 'VOL-MEI', 'MEI-PON', 'MEI-CA', 'PON-CA']);
const posFit = (a, b) => a === b ? 1 : (a === 'GOL' || b === 'GOL') ? .55 : NEAR.has(a + '-' + b) || NEAR.has(b + '-' + a) ? .93 : .85;
const pOvr = p => { const w = POSW[p.pos] || POSW.MEI; let s = 0; for (const k in w) s += w[k] * p[k]; return Math.round(s); };

/* =====================================================================
   MOTOR DA PARTIDA
   ===================================================================== */
const W = 416, H = 660, GW = 96, PR = 10, BR = 5, FRAMES = 3600, DT = 1 / 60, SC = 1.24;
const BOX_W = 240, BOX_D = 98, PEN_D = 66;
const RUNW = { LAT: 1.15, PON: 1.18, MEI: 1.1, VOL: 1.05, CA: 1, ZAG: .85 };
let STA_K = .025;
let Q_K = .0065, DAY_SD = .025, DRIB = 1, HOME_K = 1.055;
let FOUL_P = .2, DEFLECT = .6, SHOT_D = 240, OFF_T = -8;
const D4 = [[.14,.80],[.38,.84],[.62,.84],[.86,.80]];
const FORM = {
  '4-4-2':   [...D4, [.14,.62],[.38,.66],[.62,.66],[.86,.62], [.38,.53],[.62,.53]],
  '4-3-3':   [...D4, [.28,.67],[.50,.70],[.72,.67], [.16,.54],[.50,.52],[.84,.54]],
  '3-5-2':   [[.25,.82],[.50,.85],[.75,.82], [.08,.65],[.30,.68],[.50,.71],[.70,.68],[.92,.65], [.38,.53],[.62,.53]],
  '4-2-3-1': [...D4, [.38,.71],[.62,.71], [.16,.60],[.50,.61],[.84,.60], [.50,.52]],
};
const BENCH_POS = ['GOL', 'ZAG', 'LAT', 'MEI', 'CA'];
const formOf = t => FORM[t.formation] ? t.formation : '4-4-2';
function slotPos(f, i) {
  if (i === 0) return 'GOL';
  if (i > 10) return BENCH_POS[i - 11];
  const [x, y] = FORM[f][i - 1], o = Math.abs(x - .5);
  if (y > .76) return o > .3 ? 'LAT' : 'ZAG';
  if (y > .68) return 'VOL';
  if (y > .57) return o > .3 ? 'PON' : 'MEI';
  return o > .25 ? 'PON' : 'CA';
}
const avail = p => !(p.inj > 0) && !(p.susp > 0) && !(p.conv > 0);
const ad = s => s === 0 ? -1 : 1;
const oppGoal = s => ({ x: W / 2, y: s === 0 ? 0 : H });
const ownGoal = s => ({ x: W / 2, y: s === 0 ? H : 0 });
const inBoxOf = (pt, s) => Math.abs(pt.x - W / 2) < BOX_W / 2 && Math.abs(pt.y - ownGoal(s).y) < BOX_D;

/* escalação: indisponíveis dão lugar ao reserva mais adequado */
function lineup(t) {
  const f = formOf(t), xi = t.players.slice(0, 11), bench = t.players.slice(11), used = new Set();
  for (let i = 0; i < 11; i++) {
    if (avail(xi[i])) continue;
    const want = slotPos(f, i);
    const c = bench.filter(p => avail(p) && !used.has(p)).sort((a, b) => pOvr(b) * posFit(b.pos, want) - pOvr(a) * posFit(a.pos, want))[0];
    if (c) { used.add(c); xi[i] = c; }
  }
  return xi;
}
function benchOf(t, xi) { return t.players.filter(p => !xi.includes(p) && avail(p)); }

/* opts: { ai: [lados controlados pela máquina], comp, home: lado mandante ou null, weather, rec } */
function createMatch(tA, tB, opts) {
  const m = { t: 0, score: [0, 0], events: [], log: [], cards: [], freeze: 0, teams: [tA, tB], bodies: [], tactic: [0, 0], comp: opts.comp || 'liga', derby: derbyName(tA, tB),
    ai: opts.ai, home: opts.home, weather: opts.weather || 'sol', lastBall: { x: W / 2, y: H / 2 }, lastTouch: null, over: false,
    st: [0, 1].map(() => ({ shots: 0, onT: 0, corners: 0, fouls: 0, yc: 0, rc: 0, offs: 0, pos: 0 })),
    side: [], sp: null, cross: null, off: null, lastShot: null, foulCd: 0, postCd: 0, gkDive: null, rec: opts.rec ? { n: 0, pos: Array.from({ length: 80 }, () => new Float32Array(2 + 26 * 2)), bod: new Array(80), ver: 0, last: null } : null, played: new Map(), autoSub: [true, true] };
  m.ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: BR, m: .35 };
  [tA, tB].forEach((t, s) => {
    const xi = lineup(t), f = formOf(t), fis = (t.staff && t.staff.fis) || 2;
    m.side[s] = { team: t, bench: benchOf(t, xi), subs: 0, fis,
      day: gauss() * DAY_SD,
      fac: (m.home === s ? HOME_K : 1) * (.985 + (t.morale ?? 60) * .00025) * (1 + (ovr(t) - 76) * Q_K) * (1 + .008 * fis) * (m.weather === 'chuva' ? .97 : 1) * (xi.some(p => p.tr === 'lider') ? 1.01 : 1),
      noise: (1.3 - (t.chem ?? 70) / 100 * .5) * (1 - .12 * xi.filter(p => (p.ten || 0) >= 2).length / 11),
      drain: t.id === 'user' && typeof S !== 'undefined' && S && S.pre === 'fisico' ? .85 : 1 };
    const tac = t.tac || {}, sd0 = m.side[s];
    sd0.press = tac.press || 'normal'; sd0.style = tac.style || 'equil'; sd0.pk = tac.pk; sd0.fk = tac.fk; sd0.ck = tac.ck;
    sd0.shift = sd0.press === 'recuada' ? -.6 : sd0.press === 'alta' ? .4 : 0;
    if (sd0.press === 'alta') { sd0.fac *= 1.025; sd0.drain *= 1.2; } else if (sd0.press === 'recuada') sd0.drain *= .9;
    xi.forEach((p, i) => { const b = makeBody(m, s, i, p, f); if (m.derby && p.tr === 'classico') b.base *= 1.06; m.bodies.push(b); });
  });
  for (const sd of m.side) sd.fac *= 1 + sd.day;
  m.ch = [null, null];
  m.kits = pickKits(tA, tB, m.home);
  m.pitch = pitchOf(m.home != null ? [tA, tB][m.home] : null);
  for (const sd of m.side) sd.drain *= m.pitch.k;
  for (const b of m.bodies) m.played.set(b.p, b);
  kickoff(m);
  return m;
}
/* gramado: estádios grandes têm campo maior e cansam mais */

function gamesView() {

function cupsView() {

const NEWS_SEC = { 'Seu jogo': 'Seu clube', Resultado: 'Rodada', Rodada: 'Rodada', Tabela: 'Rodada', 'Série C': 'Rodada', Mercado: 'Mercado', Proposta: 'Mercado', Rumor: 'Mercado', Empréstimo: 'Mercado', Contrato: 'Mercado', Base: 'Mercado',
  Lesão: 'Médico', Suspensão: 'Médico', Polêmica: 'Polêmica', Torcida: 'Polêmica', Entrevista: 'Polêmica', Eleição: 'Bastidores', SAF: 'Bastidores', Finanças: 'Bastidores', Estrutura: 'Bastidores', Patrocínio: 'Bastidores', Comissão: 'Bastidores', Carreira: 'Bastidores', Elenco: 'Seu clube',
  Campeão: 'Títulos', Prêmios: 'Títulos', Ídolo: 'Títulos', Seleção: 'Seleção', Copas: 'Copas', Temporada: 'Geral', 'Prévia': 'Prévias' };
const secOf = n => NEWS_SEC[n.tag] || (/Copa|Liberta|Sul-Am|Mundial|Nordest|Verde|Supercopa|Recopa|Pré-Liberta|Campeonato|Paulistão/.test(n.tag) ? 'Copas' : 'Geral');
let newsFilter = 'Todas';
function headOf(t) { let m = t.search(/[.!?:]\s/); if (m > 0 && m < 20 && t[m] === ':') { t = t.slice(m + 2); m = t.search(/[.!?]\s/); } let h = m > 0 ? t.slice(0, t[m] === ':' ? m : m + 1) : t; if (h.length > 90) h = h.slice(0, 88).replace(/\s\S*$/, '') + '…'; return h; }
function newsView() {
  const F = ['Todas', 'Prévias', 'Seu clube', 'Rodada', 'Mercado', 'Copas', 'Polêmica', 'Médico', 'Bastidores', 'Títulos'];
  let list = S.news;
  if (newsFilter === 'Seu clube') list = list.filter(n => n.tid === 'user' || secOf(n) === 'Seu clube');
  else if (newsFilter !== 'Todas') list = list.filter(n => secOf(n) === newsFilter);
  list = list.slice(0, 40);
  const ed = S.news.length + (S.season - 1) * 200;
  const art = (n, lead) => { const h = headOf(n.text), hh = h.replace(/…$/, ''), k = n.text.indexOf(hh); let rest = k >= 0 && !h.endsWith('…') ? (n.text.slice(0, k) + n.text.slice(k + hh.length)).replace(/^[\s.:!?]*(Bastidores|Esfriou)?[\s.:!?]*/, '').trim() : n.text; const body = [rest, n.body].filter(Boolean).join(' '); const t = n.tid && S.teams[n.tid];
    return lead ? `<div class="lead">${t ? crest(t, 64) : ''}<div><span class="kick">${esc(secOf(n))} · ${esc(n.tag)}</span><h3>${esc(h)}</h3>${body ? `<p class="body">${esc(body)}</p>` : ''}<span class="meta">Temporada ${n.s} · ${esc(n.when)}</span></div></div>`
      : `<div class="art"><div><span class="kick">${esc(secOf(n))}</span><h4>${esc(h)}</h4>${body ? `<p class="body">${esc(body)}</p>` : ''}<span class="meta">T${n.s} · ${esc(n.when)}</span></div>${t ? crest(t, 28) : ''}</div>`; };
  const leadI = Math.max(0, list.findIndex(n => ['Campeão', 'Prévia', 'Seu jogo', 'Polêmica', 'Prêmios'].includes(n.tag) && (n.tag !== 'Prévia' || n.tid === 'user')));
  return `<div class="chips">${F.map(f => `<button data-act="nf" data-v="${f}" aria-pressed="${newsFilter === f}">${f}</button>`).join('')}</div>
  <div class="news-paper"><div class="mast"><b>Diário da Bolinha</b><span>Temporada ${S.season} · ${esc(curLabel())} · edição nº ${ed}</span></div>
  ${list.length ? art(list[leadI], true) + `<div class="cols">${list.filter((_, i) => i !== leadI).map(n => art(n, false)).join('')}</div>` : '<p class="body">Nenhuma notícia nesta seção.</p>'}</div>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act], [data-tab]'); if (!b || b.disabled) return;
  if (b.dataset.tab) { preMode = false; tab = b.dataset.tab; viewDiv = null; editId = null; render(); return; }
  const a = b.dataset.act, v = b.dataset.v, i = +b.dataset.i;

  else if (a === 'real') { draft.real = [b.dataset.d, i]; render(true); }
