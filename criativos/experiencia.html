<style>
/* Layout: palco 1920x1080. Vídeo real da barbearia em câmera lenta ocupando a tela, textos curtos entrando à esquerda sobre um degradê escuro; fecha num cartão vermelho com a logo. Visual único para TV. */
:root {
  --red: #c8101c;
  --red-dark: #7a0911;
  --white: #ffffff;
  --ink: #0f0c0d;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); overflow: hidden; font-family: var(--body); color: var(--white);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#viewport { position: fixed; inset: 0; background: var(--ink); overflow: hidden; }
#stage { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; overflow: hidden; transform-origin: center; background: var(--ink); }

#clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 60% 45%; }
#stage.run #clip { animation: kb 8s linear both; }
@keyframes kb { from { transform: scale(1.0); } to { transform: scale(1.1); } }
.shade { position: absolute; inset: 0; background:
  linear-gradient(90deg, rgba(15,12,13,.88) 0%, rgba(15,12,13,.6) 34%, rgba(15,12,13,0) 62%),
  linear-gradient(0deg, rgba(15,12,13,.55) 0%, rgba(15,12,13,0) 30%); }
.bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: var(--red); }

.copy { position: absolute; left: 110px; top: 0; bottom: 0; width: 900px; display: flex; flex-direction: column; justify-content: center; }
.beat { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); opacity: 0; }
.beat.on { opacity: 1; }
.kicker { font-family: var(--display); font-weight: 600; font-size: 38px; letter-spacing: .32em; text-transform: uppercase; color: rgba(255,255,255,.85); }
.big { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 170px; line-height: .9; margin: 14px 0 0; }
.box { display: inline-block; background: var(--red); padding: .04em .16em 0; margin-top: .06em; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; }
.lines li { display: flex; align-items: center; gap: 26px; font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 84px; line-height: 1; }
.lines li::before { content: ""; width: 18px; height: 18px; background: var(--red); transform: rotate(45deg); flex: none; }

/* Entradas */
.beat.on .in { animation: rise .6s cubic-bezier(.2,.9,.2,1) both; }
.beat.on .in.d1 { animation-delay: .15s; } .beat.on .in.d2 { animation-delay: .5s; } .beat.on .in.d3 { animation-delay: .85s; }
@keyframes rise { from { opacity: 0; transform: translateY(46px); } to { opacity: 1; transform: none; } }

/* Cartão final */
#end { position: absolute; inset: 0; background: var(--red); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
  clip-path: inset(0 100% 0 0); }
#end::before { content: ""; position: absolute; inset: -40%; background: repeating-linear-gradient(-35deg, rgba(255,255,255,.06) 0 70px, transparent 70px 140px); }
#end > * { position: relative; }
#end.on { animation: wipe .55s cubic-bezier(.7,0,.2,1) forwards; }
@keyframes wipe { to { clip-path: inset(0 0 0 0); } }
#end img { width: 980px; height: auto; }
#end .cta { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 76px; letter-spacing: .04em; background: var(--white); color: var(--red); padding: 18px 56px 10px; border-radius: 999px; }
#end.on img { animation: pop .5s cubic-bezier(.2,1.4,.4,1) .35s both; }
#end.on .cta { animation: rise .5s cubic-bezier(.2,.9,.2,1) .7s both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

#corner { position: absolute; right: 70px; bottom: 50px; height: 120px; width: auto; }

#fs { position: fixed; z-index: 20; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font: 700 14px var(--body); color: var(--white); background: rgba(122,9,17,.9);
  border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 10px 18px; cursor: pointer; transition: opacity .4s; }
#fs:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
body.idle #fs { opacity: 0; pointer-events: none; }
body.idle { cursor: none; }
@media (prefers-reduced-motion: reduce) { #stage.run #clip, .beat.on .in, #end.on img, #end.on .cta { animation: none !important; } #end.on { animation: none; clip-path: none; } }
</style>

<button id="fs" type="button">Tela cheia</button>

<script>
(function () {
  const stage = document.getElementById('stage');
  const clip = document.getElementById('clip');
  const beats = [...document.querySelectorAll('.beat')];
  const end = document.getElementById('end');
  // momentos (ms) de cada texto; o vídeo tem 8 s e depois entra o cartão final
  const TEMPOS = [[0, 2600], [2600, 5300], [5300, 8000]];
  const FIM = 8000, TOTAL = 11500;

  function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')'; }
  addEventListener('resize', fit); fit();

  let timers = [];
  function ciclo() {
    timers.forEach(clearTimeout); timers = [];
    end.classList.remove('on'); beats.forEach(b => b.classList.remove('on'));
    stage.classList.remove('run'); void stage.offsetWidth; stage.classList.add('run');
    try { clip.currentTime = 0; } catch (e) {}
    const p = clip.play(); if (p && p.catch) p.catch(() => {});
    TEMPOS.forEach(([a, b], k) => {
      timers.push(setTimeout(() => beats[k].classList.add('on'), a));
      timers.push(setTimeout(() => beats[k].classList.remove('on'), b));
    });
    timers.push(setTimeout(() => { clip.pause(); end.classList.add('on'); }, FIM));
    timers.push(setTimeout(ciclo, TOTAL));
  }
  if (clip.readyState >= 2) ciclo(); else { clip.addEventListener('loadeddata', ciclo, { once: true }); setTimeout(() => { if (!timers.length) ciclo(); }, 2500); }

  document.getElementById('fs').addEventListener('click', () => {
    const p = document.fullscreenElement ? document.exitFullscreen() : (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null);
    if (p && p.catch) p.catch(() => {});
  });
  async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
  wake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  let t;
  function poke() { document.body.classList.remove('idle'); clearTimeout(t); t = setTimeout(() => document.body.classList.add('idle'), 3000); }
  addEventListener('mousemove', poke); addEventListener('keydown', poke); poke();
})();
</script>
