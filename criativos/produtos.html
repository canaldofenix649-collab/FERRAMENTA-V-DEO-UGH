<title>Produtos Negueba Show</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@700&display=swap">
<style>
/* Layout: palco 1920x1080. Cortes rápidos: um produto por tela (foto real + nome + preço carimbado), alternando vermelho e branco; fecha com todos os produtos juntos. Visual único vermelho/branco para TV. */
:root {
  --red: #c8101c;
  --red-dark: #7a0911;
  --white: #ffffff;
  --ink: #141113;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--red-dark); overflow: hidden; font-family: var(--body); color: var(--white);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#viewport { position: fixed; inset: 0; background: var(--red-dark); overflow: hidden; }
#stage { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; overflow: hidden; transform-origin: center; }
#shaker { position: absolute; inset: 0; }
#shaker.shake { animation: shake .3s linear; }
@keyframes shake { 0% { transform: none; } 25% { transform: translate(-14px,8px) rotate(-.6deg); } 50% { transform: translate(12px,-10px) rotate(.5deg); } 75% { transform: translate(-6px,4px); } 100% { transform: none; } }

.frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.frame.red { background: var(--red); color: var(--white); }
.frame.white { background: var(--white); color: var(--red); }
.frame::before { content: ""; position: absolute; inset: -40%; animation: slide 1s linear infinite;
  background: repeating-linear-gradient(-35deg, rgba(255,255,255,.06) 0 70px, transparent 70px 140px); }
.frame.white::before { background: repeating-linear-gradient(-35deg, rgba(200,16,28,.05) 0 70px, transparent 70px 140px); }
@keyframes slide { to { transform: translateX(197px); } }
.frame > * { position: relative; }

.big { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .9; white-space: nowrap; }
.price { display: inline-flex; align-items: flex-start; gap: 12px; font-family: var(--display); font-weight: 800; line-height: .8; font-variant-numeric: tabular-nums; }
.price .rs { font-size: .3em; margin-top: .14em; }
.chip { display: inline-block; border-radius: 20px; padding: 30px 56px 18px; transform: rotate(-3deg); }
.frame.red .chip { background: var(--white); color: var(--red); }
.frame.white .chip { background: var(--red); color: var(--white); }

/* Produto */
.prod { display: grid; grid-template-columns: 640px 1fr; align-items: center; gap: 90px; width: 1640px; }
.prod .photo { width: 640px; height: 640px; border-radius: 50%; box-shadow: 0 0 0 14px rgba(255,255,255,.25), 0 30px 70px rgba(0,0,0,.35); }
.frame.white .prod .photo { box-shadow: 0 0 0 14px var(--red), 0 30px 70px rgba(0,0,0,.25); }
.prod .bottle { width: 400px; height: 800px; object-fit: cover; border-radius: 28px; justify-self: center; box-shadow: 0 30px 70px rgba(0,0,0,.35); }
.prod .txt { display: flex; flex-direction: column; align-items: flex-start; gap: 40px; }
.prod .big { font-size: 190px; }

/* Final com todos */
.all { display: flex; flex-direction: column; align-items: center; gap: 44px; }
.all .row { display: flex; align-items: center; gap: 26px; }
.all .row img.lid { width: 190px; height: 190px; border-radius: 50%; box-shadow: 0 0 0 6px rgba(255,255,255,.3); }
.all .row img.bt { width: 120px; height: 240px; object-fit: cover; border-radius: 14px; }
.all .tags { display: flex; gap: 40px; }
.all .tag { display: flex; align-items: baseline; gap: 24px; background: var(--white); color: var(--red); border-radius: 18px; padding: 18px 40px 8px; }
.all .tag .big { font-size: 90px; color: var(--ink); }
.all .tag .price { font-size: 110px; }
.all .row img { animation: pop .4s cubic-bezier(.2,1.5,.4,1) both; }

/* Entradas */
.slam { animation: slam .3s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes slam { from { transform: scale(.2) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
.punch { animation: punch .3s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes punch { from { transform: scale(2.2); opacity: 0; } to { transform: none; opacity: 1; } }
.fromright { animation: fromright .32s cubic-bezier(.2,1.2,.4,1) .1s both; }
@keyframes fromright { from { transform: translateX(1300px) skewX(-18deg); } to { transform: none; } }
.stamp { animation: stamp .32s cubic-bezier(.2,1.6,.4,1) .35s both; }
@keyframes stamp { from { transform: scale(2.6) rotate(-14deg); opacity: 0; } to { transform: rotate(-3deg); opacity: 1; } }
@keyframes pop { from { transform: scale(0); } to { transform: none; } }

#corner { position: absolute; z-index: 8; left: 60px; bottom: 40px; height: 120px; width: auto; }
#corner.hide { opacity: 0; }

#fs { position: fixed; z-index: 20; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font: 700 14px var(--body); color: var(--white); background: rgba(122,9,17,.9);
  border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 10px 18px; cursor: pointer; transition: opacity .4s; }
#fs:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
body.idle #fs { opacity: 0; pointer-events: none; }
body.idle { cursor: none; }
@media (prefers-reduced-motion: reduce) { .slam, .punch, .fromright, .stamp, .all .row img, .frame::before, #shaker.shake { animation: none !important; } }
</style>

<div id="viewport">
  <div id="stage">
    <div id="shaker"></div>
    <img id="corner" alt="Barbearia Negueba Show" src="">
  </div>
</div>

  // Produtos e preços (edite aqui)
  const POMADAS = [
    { k: 'matte', nome: 'Efeito Matte' },
    { k: 'caramelo', nome: 'Caramelo' },
    { k: 'toqueseco', nome: 'Toque Seco' },
    { k: 'orange', nome: 'Pasta Orange' },
    { k: 'uva', nome: 'Uva' },
    { k: 'black', nome: 'Pasta Black' },
    { k: 'coffee', nome: 'Pasta Coffee' }
  ];
  const PRECO_POMADA = 25;
  const POS_BARBA = { k: 'posbarba', nome: 'Pós-barba', preco: 20 };

  const stage = document.getElementById('stage');
  const shaker = document.getElementById('shaker');
  const corner = document.getElementById('corner');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')'; }
  addEventListener('resize', fit); fit();

  const price = (v, size) => `<span class="price" style="font-size:${size}px"><span class="rs">R$</span>${v}</span>`;
  const BEATS = [];
  BEATS.push({ t: 1300, bg: 'red', html: `<div class="big punch" style="font-size:330px">Pomadas</div>`, fx: 'shake' });
  POMADAS.forEach((p, i) => BEATS.push({ t: 2000, bg: i % 2 ? 'red' : 'white', fx: 'late', html:
    `<div class="prod"><img class="photo slam" alt="" src="${IMG[p.k]}"><div class="txt"><div class="big fromright">${p.nome}</div><div class="chip stamp">${price(PRECO_POMADA, 230)}</div></div></div>` }));
  BEATS.push({ t: 2800, bg: 'white', fx: 'late', html:
    `<div class="prod"><img class="bottle slam" alt="" src="${IMG.posbarba}"><div class="txt"><div class="big fromright">${POS_BARBA.nome}</div><div class="chip stamp">${price(POS_BARBA.preco, 230)}</div></div></div>` });
  BEATS.push({ t: 5500, bg: 'red', html:
    `<div class="all"><div class="row">${POMADAS.map((p, i) => `<img class="lid" style="animation-delay:${(i * .07).toFixed(2)}s" alt="" src="${IMG[p.k]}">`).join('')}<img class="bt" style="animation-delay:.5s" alt="" src="${IMG.posbarba}"></div>
     <div class="tags punch"><div class="tag"><span class="big">Pomadas</span>${price(PRECO_POMADA, 110)}</div><div class="tag"><span class="big">Pós-barba</span>${price(POS_BARBA.preco, 110)}</div></div></div>` });

  let i = -1, timer, late;
  function shake() { if (reduce) return; shaker.classList.remove('shake'); void shaker.offsetWidth; shaker.classList.add('shake'); }
  function next() {
    i = (i + 1) % BEATS.length;
    const b = BEATS[i];
    const f = document.createElement('div'); f.className = 'frame ' + b.bg; f.innerHTML = b.html;
    shaker.replaceChildren(f);
    corner.src = b.bg === 'white' ? LOGO_COR : LOGO_BRANCA;
    clearTimeout(late);
    if (b.fx === 'shake') shake();
    if (b.fx === 'late') late = setTimeout(shake, 620);
    clearTimeout(timer); timer = setTimeout(next, b.t);
  }
  next();

  document.getElementById('fs').addEventListener('click', () => {
    const p = document.fullscreenElement ? document.exitFullscreen() : (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null);
    if (p && p.catch) p.catch(() => {});
  });
  async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
  wake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  let t;
  function poke() { document.body.classList.remove('idle'); clearTimeout(t); t = setTimeout(() => document.body.classList.add('idle'), 3000); }
  addEventListener('mousemove', poke); addEventListener('keydown', poke); poke();
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); });
})();
</script>
