<meta charset="utf-8">
<title>Produtos Negueba Show</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@600;700&display=swap">
<style>
/* Layout: palco 1920x1080. Um produto por tela: a dor do cliente em cima, o nome grande e o que ele resolve, com a foto real ao lado; fecha com todos juntos e "a partir de R$25". Visual único vermelho/branco para TV. */
:root {
  --red: #c8101c;
  --red-dark: #7a0911;
  --white: #ffffff;
  --ink: #141113;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--red-dark); overflow: hidden; font-family: var(--body); color: var(--white);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#viewport { position: fixed; inset: 0; background: var(--red-dark); overflow: hidden; }
#stage { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; overflow: hidden; transform-origin: center; }
#shaker { position: absolute; inset: 0; }
#shaker.shake { animation: shake .3s linear; }
@keyframes shake { 0% { transform: none; } 25% { transform: translate(-14px,8px) rotate(-.6deg); } 50% { transform: translate(12px,-10px) rotate(.5deg); } 75% { transform: translate(-6px,4px); } 100% { transform: none; } }

.frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.frame.red { background: var(--red); color: var(--white); }
.frame.white { background: var(--white); color: var(--red); }
.frame::before { content: ""; position: absolute; inset: -40%; animation: slide 1s linear infinite;
  background: repeating-linear-gradient(-35deg, rgba(255,255,255,.06) 0 70px, transparent 70px 140px); }
.frame.white::before { background: repeating-linear-gradient(-35deg, rgba(200,16,28,.05) 0 70px, transparent 70px 140px); }
@keyframes slide { to { transform: translateX(197px); } }
.frame > * { position: relative; }

.big { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .9; white-space: nowrap; }
.price { display: inline-flex; align-items: flex-start; gap: 12px; font-family: var(--display); font-weight: 800; line-height: .8; font-variant-numeric: tabular-nums; }
.price .rs { font-size: .3em; margin-top: .14em; }

/* Produto */
.prod { display: grid; grid-template-columns: 660px 1fr; align-items: center; gap: 100px; width: 1660px; }
.prod .photo { width: 660px; height: 660px; filter: drop-shadow(0 30px 40px rgba(0,0,0,.4)); }
.prod .bottle { height: 860px; width: auto; justify-self: center; filter: drop-shadow(0 30px 40px rgba(0,0,0,.4)); }
.prod .txt { display: flex; flex-direction: column; align-items: flex-start; }
.prod .dor { font-family: var(--display); font-weight: 600; font-size: 64px; line-height: 1.05; opacity: .92; }
.prod .big { font-size: 170px; margin-top: 18px; }
.prod .faz { margin-top: 30px; display: inline-block; font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 58px; line-height: 1; padding: 16px 30px 10px; border-radius: 12px; }
.frame.red .faz { background: var(--white); color: var(--red); }
.frame.white .faz { background: var(--red); color: var(--white); }

/* Final */
.all { display: flex; flex-direction: column; align-items: center; gap: 50px; }
.all .row { display: flex; align-items: center; gap: 22px; }
.all .row img.lid { width: 200px; height: 200px; filter: drop-shadow(0 14px 18px rgba(0,0,0,.35)); }
.all .tags { display: flex; gap: 40px; align-items: stretch; }
.all .tag { display: flex; align-items: center; gap: 26px; background: var(--white); color: var(--red); border-radius: 20px; padding: 20px 44px 12px; }
.all .tag .lbl { display: flex; flex-direction: column; font-family: var(--display); text-transform: uppercase; line-height: .95; }
.all .tag .lbl b { font-weight: 800; font-size: 84px; color: var(--ink); }
.all .tag .lbl small { font-weight: 600; font-size: 40px; letter-spacing: .08em; }
.all .tag .price { font-size: 150px; }
.all .row img { animation: pop .4s cubic-bezier(.2,1.5,.4,1) both; }

/* Entradas */
.slam { animation: slam .32s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes slam { from { transform: scale(.2) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
.punch { animation: punch .3s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes punch { from { transform: scale(2.2); opacity: 0; } to { transform: none; opacity: 1; } }
.in { animation: fromright .34s cubic-bezier(.2,1.2,.4,1) both; }
.in.d1 { animation-delay: .1s; } .in.d2 { animation-delay: .45s; } .in.d3 { animation-delay: .8s; }
@keyframes fromright { from { transform: translateX(1300px) skewX(-18deg); } to { transform: none; } }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }

#corner { position: absolute; z-index: 8; left: 60px; bottom: 40px; height: 120px; width: auto; }

#fs { position: fixed; z-index: 20; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font: 700 14px var(--body); color: var(--white); background: rgba(122,9,17,.9);
  border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 10px 18px; cursor: pointer; transition: opacity .4s; }
#fs:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
body.idle #fs { opacity: 0; pointer-events: none; }
body.idle { cursor: none; }
@media (prefers-reduced-motion: reduce) { .slam, .punch, .in, .all .row img, .frame::before, #shaker.shake { animation: none !important; } }
</style>

<div id="viewport">
  <div id="stage">
    <div id="shaker"></div>
    <img id="corner" alt="Barbearia Negueba Show" src="">
  </div>
</div>
<button id="fs" type="button">Tela cheia</button>

    `<div class="all"><div class="row">${POMADAS.map((p, i) => `<img class="lid" style="animation-delay:${(i * .07).toFixed(2)}s" alt="" src="${IMG[p.k]}">`).join('')}</div>

     <div class="tag"><span class="lbl"><small>Loção</small><b>Pós-barba</b></span>${price(POS.preco, 150)}</div></div></div>` });

  let i = -1, timer, late;
  function shake() { if (reduce) return; shaker.classList.remove('shake'); void shaker.offsetWidth; shaker.classList.add('shake'); }
  function next() {
    i = (i + 1) % BEATS.length;
    const b = BEATS[i];
    const f = document.createElement('div'); f.className = 'frame ' + b.bg; f.innerHTML = b.html;
    shaker.replaceChildren(f);
    corner.src = b.bg === 'white' ? LOGO_COR : LOGO_BRANCA;
    clearTimeout(late);
    if (b.fx === 'shake') shake();
    if (b.fx === 'late') late = setTimeout(shake, 450);
    clearTimeout(timer); timer = setTimeout(next, b.t);
  }
  next();

  document.getElementById('fs').addEventListener('click', () => {
    const p = document.fullscreenElement ? document.exitFullscreen() : (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null);
    if (p && p.catch) p.catch(() => {});
  });
  async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
  wake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  let t;
  function poke() { document.body.classList.remove('idle'); clearTimeout(t); t = setTimeout(() => document.body.classList.add('idle'), 3000); }
  addEventListener('mousemove', poke); addEventListener('keydown', poke); poke();
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); });
})();
</script>
