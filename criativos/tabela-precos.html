<title>Tabela Negueba Show</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Archivo:wght@500;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: palco 1920x1080. Esquerda: quadro branco com a tabela completa (sempre visível). Direita: destaque vermelho que passa serviço por serviço com o preço grande. Visual único vermelho/branco para TV. */
:root {
  --red: #b8101c;
  --red-dark: #7a0911;
  --white: #ffffff;
  --ink: #161214;
  --soft: #f4efef;
  --display: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--red-dark); overflow: hidden; font-family: var(--body); color: var(--white);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#viewport { position: fixed; inset: 0; background: var(--red-dark); overflow: hidden; }
#stage {
  width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; overflow: hidden; transform-origin: center;
  background:
    radial-gradient(circle, rgba(255,255,255,.07) 2.5px, transparent 3px) 0 0 / 28px 28px,
    radial-gradient(1100px 800px at 80% 35%, rgba(255,90,90,.3), transparent 60%),
    var(--red);
  display: grid; grid-template-columns: 820px 1fr;
}

/* Quadro de preços */
.board {
  background: var(--white); color: var(--ink); margin: 56px 0 56px 64px; border-radius: 28px;
  padding: 44px 56px 40px; display: flex; flex-direction: column;
  box-shadow: 0 30px 80px rgba(60,0,6,.45);
}
.board .logo { height: 190px; width: auto; align-self: center; }
.board .rule { height: 6px; background: var(--red); border-radius: 3px; margin: 26px 0 18px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
.row {
  display: flex; align-items: baseline; gap: 16px; padding: 12px 22px; border-radius: 14px;
  font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 60px; line-height: 1;
  transition: background .35s, color .35s, transform .35s;
}
.row .dots { flex: 1; border-bottom: 5px dotted rgba(22,18,20,.25); transform: translateY(-10px); transition: border-color .35s; }
.row .price { font-variant-numeric: tabular-nums; color: var(--red); transition: color .35s; }
.row .price small { font-size: .55em; margin-right: 6px; }
.row.on { background: var(--red); color: var(--white); transform: scale(1.04); }
.row.on .price { color: var(--white); }
.row.on .dots { border-color: rgba(255,255,255,.5); }
.board .foot { font-family: var(--mono); font-size: 22px; letter-spacing: .2em; text-transform: uppercase; color: rgba(22,18,20,.55); text-align: center; margin-top: 18px; }

/* Destaque */
.spot { position: relative; display: flex; flex-direction: column; justify-content: center; padding: 0 96px 0 110px; }
.spot .eyebrow { font-family: var(--mono); font-size: 30px; letter-spacing: .3em; text-transform: uppercase; opacity: .9; }
.spot .name { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 170px; line-height: .9; margin: 18px 0 0; }
.spot .desc { font-size: 42px; line-height: 1.3; margin: 22px 0 0; max-width: 24ch; color: rgba(255,255,255,.88); }
.spot .tag {
  margin-top: 46px; align-self: flex-start; display: inline-flex; align-items: flex-start; gap: 10px;
  background: var(--white); color: var(--red); border-radius: 36px; padding: 18px 54px 6px 44px;
  font-family: var(--display); font-weight: 900; line-height: .9; box-shadow: 0 24px 60px rgba(60,0,6,.4);
}
.spot .tag .rs { font-size: 90px; margin-top: 24px; }
.spot .tag .val { font-size: 300px; font-variant-numeric: tabular-nums; }
.spot .count { position: absolute; right: 96px; bottom: 64px; font-family: var(--mono); font-size: 26px; letter-spacing: .2em; opacity: .75; }

/* Animação de troca */
.swap .in { animation: up .55s cubic-bezier(.2,.9,.2,1) both; }
.swap .in.d1 { animation-delay: .08s; } .swap .in.d2 { animation-delay: .16s; }
.swap .tag { animation: stamp .5s cubic-bezier(.2,1.5,.4,1) .25s both; }
@keyframes up { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: none; } }
@keyframes stamp { from { opacity: 0; transform: scale(1.8) rotate(-6deg); } to { opacity: 1; transform: rotate(-2deg); } }

#fs { position: fixed; z-index: 20; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font: 600 14px var(--body); color: var(--white); background: rgba(122,9,17,.9);
  border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 10px 18px; cursor: pointer; transition: opacity .4s; }
#fs:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
body.idle #fs { opacity: 0; pointer-events: none; }
body.idle { cursor: none; }
@media (prefers-reduced-motion: reduce) { .swap .in, .swap .tag { animation: none; } .row { transition: none; } }
</style>

<button id="fs" type="button">Tela cheia</button>

<script>
(function () {
  // Serviços e preços (edite aqui)
  const SERVICOS = [
    { nome: 'Corte', preco: 25, desc: 'O corte do seu jeito, com acabamento caprichado.' },
    { nome: 'Barba', preco: 20, desc: 'Barba desenhada, alinhada e bem cuidada.' },
    { nome: 'Limpeza de pele', curto: 'Limpeza<br>de pele', preco: 10, desc: 'Pele limpa e renovada pra fechar o visual.' },
    { nome: 'Sobrancelha', preco: 5, desc: 'Sobrancelha alinhada, sem exagero.' },
    { nome: 'Pezinho', preco: 7, desc: 'Aquele acabamento entre um corte e outro.' },
    { nome: 'Pigmentação', preco: 20, desc: 'Mais preenchimento e definição no corte e na barba.' }
  ];
  const TEMPO = 4500;

  const stage = document.getElementById('stage');
  function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')'; }
  addEventListener('resize', fit); fit();

  const list = document.getElementById('list');
  const rows = SERVICOS.map(s => {
    const li = document.createElement('li'); li.className = 'row';
    li.innerHTML = `<span>${s.nome}</span><span class="dots"></span><span class="price"><small>R$</small>${s.preco}</span>`;
    list.appendChild(li); return li;
  });

  const spot = document.getElementById('spot');
  let i = -1;
  function next() {
    i = (i + 1) % SERVICOS.length;
    const s = SERVICOS[i];
    rows.forEach((r, k) => r.classList.toggle('on', k === i));
    spot.classList.remove('swap'); void spot.offsetWidth;
    spot.innerHTML = `
      <div class="eyebrow in">Serviço</div>
      <h2 class="name in d1">${s.curto || s.nome}</h2>
      <p class="desc in d2">${s.desc}</p>
      <div class="tag"><span class="rs">R$</span><span class="val">${s.preco}</span></div>
      <div class="count">${String(i + 1).padStart(2, '0')} / ${String(SERVICOS.length).padStart(2, '0')}</div>`;
    spot.classList.add('swap');
  }
  next(); setInterval(next, TEMPO);

  document.getElementById('fs').addEventListener('click', () => {
    const p = document.fullscreenElement ? document.exitFullscreen() : (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null);
    if (p && p.catch) p.catch(() => {});
  });
  async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
  wake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  let t;
  function poke() { document.body.classList.remove('idle'); clearTimeout(t); t = setTimeout(() => document.body.classList.add('idle'), 3000); }
  addEventListener('mousemove', poke); addEventListener('keydown', poke); poke();
})();
</script>
