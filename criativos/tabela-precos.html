<title>Tabela Negueba Show</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Barlow:wght@500;700&display=swap">
<style>
/* Layout: palco 1920x1080 escalado. Cortes rápidos tela a tela (logo, cada serviço com preço carimbado, novidade com estouro) e no fim a tabela completa. Visual único vermelho/branco para TV. */
:root {
  --red: #c8101c;
  --red-dark: #7a0911;
  --white: #ffffff;
  --ink: #141113;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--red-dark); overflow: hidden; font-family: var(--body); color: var(--white);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#viewport { position: fixed; inset: 0; background: var(--red-dark); overflow: hidden; }
#stage { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; overflow: hidden; transform-origin: center; }
#shaker { position: absolute; inset: 0; }
#shaker.shake { animation: shake .3s linear; }
@keyframes shake {
  0% { transform: none; } 20% { transform: translate(-18px,10px) rotate(-.8deg); } 40% { transform: translate(16px,-12px) rotate(.7deg); }
  60% { transform: translate(-10px,-6px); } 80% { transform: translate(6px,6px); } 100% { transform: none; }
}
#flash { position: absolute; inset: 0; background: var(--white); opacity: 0; pointer-events: none; z-index: 9; }
#flash.go { animation: flash .16s ease-out; }
@keyframes flash { from { opacity: .85; } to { opacity: 0; } }

/* Quadros */
.frame { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.frame.red { background: var(--red); color: var(--white); }
.frame.white { background: var(--white); color: var(--red); }
.frame.ink { background: var(--ink); color: var(--white); }
.frame::before { content: ""; position: absolute; inset: -40%; animation: slide 1s linear infinite;
  background: repeating-linear-gradient(-35deg, rgba(255,255,255,.06) 0 70px, transparent 70px 140px); }
.frame.white::before { background: repeating-linear-gradient(-35deg, rgba(200,16,28,.05) 0 70px, transparent 70px 140px); }
@keyframes slide { to { transform: translateX(197px); } }
.frame > * { position: relative; }

.kicker { font-family: var(--display); font-weight: 600; font-size: 46px; letter-spacing: .32em; text-transform: uppercase; margin-right: -.32em; opacity: .9; }
.big { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .9; letter-spacing: -.005em; white-space: nowrap; }
.price { display: inline-flex; align-items: flex-start; gap: 14px; font-family: var(--display); font-weight: 800; line-height: .8; font-variant-numeric: tabular-nums; }
.price .rs { font-size: .3em; margin-top: .14em; }
.chip { display: inline-block; background: currentColor; border-radius: 20px; padding: 34px 64px 22px; margin-top: 36px; }
.frame.red .chip .price { color: var(--red); }
.frame.white .chip .price, .frame.ink .chip .price { color: var(--white); }
.frame.white .chip { background: var(--red); }
.frame.ink .chip { background: var(--red); }

/* Serviço: nome à esquerda, preço à direita */
.svc { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 80px; width: 1600px; text-align: left; }
.svc .num { font-family: var(--display); font-weight: 600; font-size: 40px; letter-spacing: .25em; opacity: .8; }
.svc .big { font-size: 210px; }
.svc .chip { margin: 0; transform: rotate(-3deg); }
.svc .desc { font-family: var(--body); font-weight: 500; font-size: 46px; line-height: 1.25; margin: 22px 0 0; max-width: 24ch; white-space: normal; opacity: .92; }

/* Entradas */
.punch { animation: punch .3s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes punch { from { transform: scale(2.2); opacity: 0; } to { transform: none; opacity: 1; } }
.slam { animation: slam .3s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes slam { from { transform: scale(.2) rotate(-10deg); } to { transform: none; } }
.stamp { animation: stamp .32s cubic-bezier(.2,1.6,.4,1) .28s both; }
@keyframes stamp { from { transform: scale(2.6) rotate(-14deg); opacity: 0; } to { transform: rotate(-3deg); opacity: 1; } }
.fromleft { animation: fromleft .3s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes fromleft { from { transform: translateX(-1600px) skewX(18deg); } to { transform: none; } }
.fromright { animation: fromright .3s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes fromright { from { transform: translateX(1600px) skewX(-18deg); } to { transform: none; } }
.d1 { animation-delay: .12s; } .d2 { animation-delay: .24s; } .d3 { animation-delay: .36s; }

/* Novidade */
.badge { display: inline-block; background: var(--white); color: var(--red); font-family: var(--display); font-weight: 800; text-transform: uppercase;
  font-size: 64px; letter-spacing: .14em; padding: 14px 40px 8px; border-radius: 12px; transform: rotate(-4deg); }
.blink { animation: blink .5s steps(1) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.burst { position: relative; width: 980px; height: 980px; display: grid; place-items: center; }
.burst svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.burst .inner { position: relative; display: flex; flex-direction: column; align-items: center; color: var(--red); transform: rotate(-6deg); }
.burst .inner .lbl { font-family: var(--display); font-weight: 800; font-size: 56px; text-transform: uppercase; letter-spacing: .12em; margin-top: 6px; }
.pulse { animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 50% { transform: rotate(-6deg) scale(1.06); } }
.nov-side { display: flex; align-items: center; gap: 30px; }
.nov-side .txt { text-align: left; }
.nov-side .big { font-size: 150px; }
.nov-side .burst { width: 820px; height: 820px; }

/* Tabela completa */
.table { width: 1660px; display: grid; grid-template-columns: 560px 1fr; gap: 70px; align-items: center; text-align: left; }
.table .logo-box { display: flex; flex-direction: column; align-items: center; gap: 30px; }
.table .logo-box img { width: 520px; height: auto; }
.table .logo-box .kicker { color: var(--ink); font-size: 36px; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rows li { display: flex; align-items: baseline; gap: 18px; font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 76px; line-height: 1.05; color: var(--ink);
  animation: fromright .35s cubic-bezier(.2,1.2,.4,1) both; }
.rows li .dots { flex: 1; border-bottom: 5px dotted rgba(20,17,19,.25); transform: translateY(-14px); }
.rows li .p { color: var(--red); font-variant-numeric: tabular-nums; }
.rows li .p small { font-size: .55em; margin-right: 6px; }
.rows li.new { background: var(--red); color: var(--white); border-radius: 16px; padding: 10px 26px 4px; margin: 36px -26px 0; position: relative; }
.rows li.new .p { color: var(--white); font-size: 1.15em; }
.rows li.new .dots { border-color: rgba(255,255,255,.5); }
.rows li.new .tagnew { position: absolute; top: -30px; right: 20px; background: var(--ink); color: var(--white); font-size: 34px; letter-spacing: .14em; padding: 6px 18px 2px; border-radius: 8px; transform: rotate(3deg); }

/* Logo no canto */
#corner { position: absolute; z-index: 8; left: 60px; bottom: 40px; height: 120px; width: auto; }
#corner.hide { opacity: 0; }
.biglogo { width: 1200px; max-width: 80%; height: auto; }

#fs { position: fixed; z-index: 20; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font: 700 14px var(--body); color: var(--white); background: rgba(122,9,17,.9);
  border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 10px 18px; cursor: pointer; transition: opacity .4s; }
#fs:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
body.idle #fs { opacity: 0; pointer-events: none; }
body.idle { cursor: none; }
@media (prefers-reduced-motion: reduce) {
  .punch, .slam, .stamp, .fromleft, .fromright, .rows li, .burst svg, .pulse, .blink, .frame::before, #shaker.shake { animation: none !important; }
}
</style>

    <div id="shaker"></div>
    <div id="flash"></div>
    <img id="corner" alt="Barbearia Negueba Show" src="">
  </div>
</div>

  // Serviços e preços (edite aqui)
  const SERVICOS = [
    { nome: 'Corte', preco: 25, desc: 'O corte do seu jeito, com acabamento caprichado.' },
    { nome: 'Barba', preco: 20, desc: 'Barba desenhada, alinhada e bem cuidada.' },
    { nome: 'Limpeza de pele', preco: 10, desc: 'Pele limpa e renovada pra fechar o visual.' },
    { nome: 'Sobrancelha', preco: 5, desc: 'Sobrancelha alinhada, sem exagero.' },
    { nome: 'Pezinho', preco: 7, desc: 'Aquele acabamento entre um corte e outro.' },
    { nome: 'Pigmentação', preco: 20, desc: 'Mais preenchimento e definição no corte e na barba.' }
  ];
  const NOVIDADE = { nome: 'Depilação na cera', detalhe: 'Nariz + ouvido', preco: 20 };

  const stage = document.getElementById('stage');
  const shaker = document.getElementById('shaker');
  const flash = document.getElementById('flash');
  const corner = document.getElementById('corner');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')'; }
  addEventListener('resize', fit); fit();

  const price = (v, size) => `<span class="price" style="font-size:${size}px"><span class="rs">R$</span>${v}</span>`;
  const star = (n, r1, r2) => { let p = []; for (let k = 0; k < n * 2; k++) { const r = k % 2 ? r2 : r1, a = Math.PI * k / n; p.push((500 + Math.cos(a) * r).toFixed(1) + ',' + (500 + Math.sin(a) * r).toFixed(1)); } return p.join(' '); };
  const burst = `<svg viewBox="0 0 1000 1000"><polygon points="${star(22, 490, 400)}" fill="#fff"/></svg>`;

  // Roteiro de cortes
  const BEATS = [];
  BEATS.push({ t: 1500, bg: 'white', nocorner: true, fx: 'flash', html: `<img class="biglogo slam" alt="Barbearia Negueba Show" src="${LOGO_COR}">` });
  BEATS.push({ t: 600, bg: 'red', html: `<div class="big punch" style="font-size:300px">Tabela</div>` });
  BEATS.push({ t: 700, bg: 'ink', fx: 'shake', html: `<div class="big slam" style="font-size:300px">de preços</div>` });
  SERVICOS.forEach((s, k) => {
    const bg = k % 2 ? 'white' : 'red';
    const anim = k % 2 ? 'fromright' : 'fromleft';
    BEATS.push({ t: 2300, bg, fx: 'shake-late', html:
      `<div class="svc"><div><div class="num ${anim}">${String(k + 1).padStart(2, '0')} / ${String(SERVICOS.length).padStart(2, '0')}</div><div class="big ${anim}" style="font-size:${s.nome.length > 11 ? 170 : 210}px">${s.nome}</div><p class="desc ${anim} d2">${s.desc}</p></div>
       <div class="chip stamp">${price(s.preco, 300)}</div></div>` });
  });
  BEATS.push({ t: 450, bg: 'white', fx: 'flash', html: `<div class="big slam" style="font-size:340px">Atenção!</div>` });
  BEATS.push({ t: 1000, bg: 'red', fx: 'shake', html: `<div class="badge blink" style="font-size:200px;padding:30px 80px 14px">Novidade</div>` });
  BEATS.push({ t: 900, bg: 'ink', html: `<div class="kicker fromleft">Agora na Negueba Show</div><div class="big punch d1" style="font-size:230px">${NOVIDADE.nome}</div>` });
  BEATS.push({ t: 900, bg: 'white', fx: 'shake', html: `<div class="big slam" style="font-size:280px">${NOVIDADE.detalhe}</div>` });
  BEATS.push({ t: 3200, bg: 'red', fx: 'flash', html:
    `<div class="nov-side"><div class="txt"><div class="badge fromleft">Novidade</div><div class="big fromleft d1" style="margin-top:34px">Depilação<br>na cera</div><div class="kicker fromleft d2" style="margin-top:18px">${NOVIDADE.detalhe}</div></div>
     <div class="burst slam d1"><div style="position:absolute;inset:0">${burst}</div><div class="inner pulse">${price(NOVIDADE.preco, 320)}<span class="lbl">os dois</span></div></div></div>` });
  BEATS.push({ t: 6500, bg: 'white', nocorner: true, html:
    `<div class="table"><div class="logo-box"><img class="slam" alt="Barbearia Negueba Show" src="${LOGO_COR}"><div class="kicker">Tabela de serviços</div></div>
     <ul class="rows">${SERVICOS.map((s, k) => `<li style="animation-delay:${(k * .08).toFixed(2)}s"><span>${s.nome}</span><span class="dots"></span><span class="p"><small>R$</small>${s.preco}</span></li>`).join('')}
     <li class="new" style="animation-delay:${(SERVICOS.length * .08 + .2).toFixed(2)}s"><span class="tagnew">Novidade</span><span>Nariz + ouvido</span><span class="dots"></span><span class="p"><small>R$</small>${NOVIDADE.preco}</span></li></ul></div>` });

  let i = -1, timer, lateShake;
  function doShake() { if (reduce) return; shaker.classList.remove('shake'); void shaker.offsetWidth; shaker.classList.add('shake'); }
  function next() {
    i = (i + 1) % BEATS.length;
    const b = BEATS[i];
    const f = document.createElement('div');
    f.className = 'frame ' + b.bg;
    f.innerHTML = b.html;
    shaker.replaceChildren(f);
    corner.src = b.bg === 'white' ? LOGO_COR : LOGO_BRANCA;
    corner.classList.toggle('hide', !!b.nocorner);
    clearTimeout(lateShake);
    if (b.fx === 'shake') doShake();
    if (b.fx === 'shake-late') lateShake = setTimeout(doShake, 560);
    if (b.fx === 'flash' && !reduce) { flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); }
    clearTimeout(timer); timer = setTimeout(next, b.t);
  }
  next();

  document.getElementById('fs').addEventListener('click', () => {
    const p = document.fullscreenElement ? document.exitFullscreen() : (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null);
    if (p && p.catch) p.catch(() => {});

  async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
  wake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  let t;
  function poke() { document.body.classList.remove('idle'); clearTimeout(t); t = setTimeout(() => document.body.classList.add('idle'), 3000); }
  addEventListener('mousemove', poke); addEventListener('keydown', poke); poke();
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); });
})();
</script>
